<!doctype html>
<!-- [VIEW3D-V1] Vue 3D du reseau de calibration.
     Frustums des cams (couleur = tier de confiance), landmarks, meshes
     proceduraux, plan d'ocean a z=0 (le datum que les iles des Keys ont
     viole pendant des mois sans que personne le voie — cette vue existe
     pour que ca n'arrive plus jamais).
     Donnees: /api/scene3d (coins de frustum calcules par gtamaplib serveur-
     side, zero replication de convention ypr en JS). three.js vendorise. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>gtamaplib — 3D</title>
<style>
  :root { --bg:#0a0a0c; --surface:#13131a; --surface2:#1c1c26; --border:#252535;
          --green:#4ade80; --red:#f87171; --text:#e2e2f0; --dim:#5a5a7a;
          --mid:#9090b0; --mono:'JetBrains Mono',monospace; }
  html, body { margin:0; height:100%; background:var(--bg); overflow:hidden;
               font:11px var(--mono); color:var(--mid); }
  #c { position:fixed; inset:0; width:100%; height:100%; } /* [POV-V10] SANS width/height CSS, un canvas (element remplace) s affiche a sa taille INTERNE (= 2x viewport avec pixelRatio 2) ancre haut-gauche -> on voyait le quart haut-gauche zoome 2x. LA cause de toute la saga zoom. */
  .panel { position:fixed; z-index:10; background:rgba(19,19,26,.88);
           backdrop-filter:blur(8px); border:1px solid var(--border);
           border-radius:10px; padding:10px 12px; }
  #hud { top:12px; left:12px; display:flex; align-items:center; gap:12px; }
  #hud .sect { color:var(--dim); font-size:9.5px; letter-spacing:.12em;
               text-transform:uppercase; margin:0; }
  #hud .chips { display:flex; flex-wrap:nowrap; gap:6px; }
  .lchip { font:11px var(--mono); padding:3px 10px; border-radius:12px;
           background:var(--surface2); border:1px solid var(--border);
           color:var(--dim); cursor:pointer; user-select:none;
           transition:color .12s, border-color .12s; }
  .lchip:hover { color:var(--mid); }
  .lchip.on { color:var(--green); border-color:rgba(74,222,128,.45); }
  #info { top:12px; right:12px; display:none; max-width:280px; color:var(--mid); }
  #info b { color:var(--text); }
  #info .rms-bad { color:var(--red); }
  #legend { bottom:12px; left:12px; display:flex; gap:13px; padding:7px 14px; }
  .sw { display:inline-block; width:8px; height:8px; border-radius:50%;
        margin-right:6px; vertical-align:-1px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="panel" id="hud">
  <div class="sect">Layers</div>
  <div class="chips">
    <span class="lchip on" id="ly-cams">cams</span>
    <span class="lchip on" id="ly-lms">landmarks</span>
    <span class="lchip on" id="ly-meshes">meshes</span>
    <span class="lchip on" id="ly-terrain" title="Terrain reel (height map L16 du leak, z=706.07v-301.01)">terrain</span>
    <span class="lchip" id="ly-leakmap" title="Fond de carte: full map leak (composite sur yanis)">leak map</span>
    <span class="lchip" id="btn-shot" title="PNG de la vue + frame en medaillon">&#8681; shot</span>
  </div>
</div>
<div class="panel" id="info"></div>
<!-- [VIEW3D-POV] vue a travers une cam: position/orientation/fov exacts -->
<!-- [POV-ZOOM-V1] centre en X ET en Y: a zoom 1 la frame fait 100vh et top:50%
     translateY(-50%) est identique a top:0 ; des qu'elle rapetisse il faut
     qu'elle reste centree sur l'axe optique, sinon elle glisse vers le haut. -->
<img id="pov-frame" style="display:none;position:fixed;top:50%;left:50%;
     transform:translate(-50%,-50%);height:100vh;z-index:5;pointer-events:none;opacity:.5">
<div id="pov-marks" style="position:fixed;inset:0;z-index:6;pointer-events:none;display:none"></div>
<div class="panel" id="pov" style="display:none;top:12px;left:50%;transform:translateX(-50%);
     z-index:11;align-items:center;gap:10px">
  <b id="pov-name" style="color:var(--text)"></b>
  <label style="margin-left:10px">frame <input id="pov-alpha" type="range" min="0" max="100"
         value="50" style="width:90px;vertical-align:middle"></label>
  <label style="margin-left:10px" title="scroll: widens the field of view without moving the camera — the frame shrinks by the same factor and stays aligned">zoom out <input id="pov-zoom" type="range" min="100" max="600"
         value="100" style="width:110px;vertical-align:middle"></label>
  <span id="pov-zoomv" style="color:var(--dim);font-size:10px">x1.0</span>
  <button id="pov-exit" style="margin-left:10px;background:var(--surface2);color:var(--text);
          border:1px solid var(--border);border-radius:5px;padding:2px 10px;cursor:pointer;
          font:11px var(--mono)">exit (Esc)</button>
  <!-- tag de version: si tu ne vois pas ce numero, tu tournes du vieux code -->
  <span id="pov-ver" style="color:var(--dim);font-size:9px;margin-left:8px">v4</span>
</div>
<div class="panel" id="legend">
  <span><span class="sw" style="background:#a78bfa"></span>anchor</span>
  <span style="margin-left:10px"><span class="sw" style="background:#4ade80"></span>high</span>
  <span style="margin-left:10px"><span class="sw" style="background:#fbbf24"></span>medium</span>
  <span style="margin-left:10px"><span class="sw" style="background:#fb923c"></span>low</span>
  <span style="margin-left:10px"><span class="sw" style="background:#6b7280"></span>unverified</span>
  <span style="margin-left:14px"><span class="sw" style="background:#60a5fa"></span>z-constrained LM</span>
</div>
<!-- [POV-V5] toute erreur JS devient VISIBLE: plus d'ecran noir muet -->
<div id="jserr" style="display:none;position:fixed;left:12px;bottom:52px;z-index:99;
     background:#7f1d1dee;color:#fecaca;font:11px monospace;padding:8px 12px;
     border-radius:8px;max-width:80vw;white-space:pre-wrap"></div>
<script>
addEventListener('error', e => {
  const el = document.getElementById('jserr');
  el.style.display = 'block';
  el.textContent = 'JS ERROR: ' + (e.message || e.type) + '\n' + (e.filename || '') + ':' + (e.lineno || '');
});
addEventListener('unhandledrejection', e => {
  const el = document.getElementById('jserr');
  if (el.style.display === 'block') return;   // un message explique est deja affiche
  el.style.display = 'block';
  el.textContent = 'PROMISE REJECT: ' + (e.reason && e.reason.message || e.reason);
});
</script>
<script type="importmap">
{ "imports": { "three": "/threejs/three.module.min.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// [VIEW3D-TAB] en iframe (onglet 3D de calib), le lien "← calib" est
// redondant et ouvrirait l'app dans l'app — on le masque.
// (HUD v2: plus de lien calib — rien a masquer en iframe)
import { MapControls } from '/threejs/MapControls.js';

const TIER_COLORS = { anchor: 0xa78bfa, high: 0x4ade80, medium: 0xfbbf24,
                      low: 0xfb923c, unverified: 0x6b7280 };
const FRUSTUM_LEN = 260;   // metres
const canvas = document.getElementById('c');
// [POV-V6] Safari limite les contextes WebGL par page et tue les plus vieux
// (l'erreur d'Alexandre: getShaderPrecisionFormat sur contexte null apres
// une journee de reloads). On echoue PROPREMENT et on survit a la perte.
function showErr(msg) {
  const el = document.getElementById('jserr');
  el.style.display = 'block';
  el.textContent = msg;
}
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'default',
    logarithmicDepthBuffer: true });  // [HEIGHTMAP-V1] 20 km de scene: sans ca, z-fighting terrain/tiles
} catch (e) {
  showErr('WebGL INDISPONIBLE — Safari a refuse le contexte (limite de contextes/GPU).\n' +
          'Ferme des onglets lourds (cartes, videos), ou utilise Chrome pour le mode 3D.\n(' + (e.message || e) + ')');
  const rb = document.createElement('button');
  rb.textContent = 'reessayer';
  rb.style.cssText = 'display:block;margin-top:8px;padding:4px 12px;cursor:pointer;' +
    'background:#450a0a;color:#fecaca;border:1px solid #fecaca;border-radius:5px;font:11px monospace';
  rb.onclick = () => location.reload();
  document.getElementById('jserr').appendChild(rb);
  throw e;
}
canvas.addEventListener('webglcontextlost', ev => {
  ev.preventDefault();   // permet la restauration automatique par three.js
  showErr('Contexte WebGL perdu (trop d\'onglets/contextes) — tentative de recuperation...');
});
canvas.addEventListener('webglcontextrestored', () => {
  const el = document.getElementById('jserr');
  el.style.display = 'none';
  resize();
});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a0c);
let fog = null; // configure apres le calcul du span

// Monde z-up (convention gtamaplib)
const camera = new THREE.PerspectiveCamera(55, 1, 1, 50000);
camera.up.set(0, 0, 1);
// [VIEW3D-V2] MapControls: drag = pan (feel d'app de carte), clic droit =
// orbite, zoom vers le curseur, double-clic = recentrer la cible au sol.
const controls = new MapControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.zoomToCursor = true;
controls.screenSpacePanning = false;
controls.zoomSpeed = 3.0;
controls.panSpeed = 3.0;
controls.rotateSpeed = 1.0;
controls.maxPolarAngle = Math.PI * 0.495;   // jamais sous le sol

function realSize() {
  // [POV-V5] la verite de taille = le canvas mesure. innerWidth/innerHeight
  // peuvent mentir en iframe (mesure chez Alexandre: 1471x78 avec un ecran
  // plein) — le rect CSS du canvas, lui, ne ment pas.
  // [POV-V7] mesure du DOCUMENT, pas du canvas: le canvas est fixed (hors
  // flux), le document ne peut pas heriter de sa taille -> AUCUNE boucle de
  // retroaction possible (Chrome d'Alexandre: rect du canvas non contraint
  // un instant -> taille interne reinjectee -> doublement/frame -> 2^24).
  let W = Math.round(document.documentElement.clientWidth) || innerWidth;
  let H = Math.round(document.documentElement.clientHeight) || innerHeight;
  W = Math.min(W, 8192); H = Math.min(H, 8192);   // garde-fou absolu
  if (W < 8 || H < 8) { W = 1280; H = 720; }
  return [W, H];
}
function resize() {
  const [W, H] = realSize();
  renderer.setSize(W, H, false);
  camera.aspect = W / H;
  camera.updateProjectionMatrix();
  updatePovDbg();
}
addEventListener('resize', resize); resize();
// [POV-V4] garde-taille par frame: en iframe, la transition display:none ->
// block peut rater l'evenement resize (mesure chez Alexandre: iframe a
// 1471x78 alors que l'ecran est plein) — on verifie a chaque tick et on
// s'auto-repare.
let _lastW = 0, _lastH = 0;
function sizeGuard() {
  const [W, H] = realSize();
  if (W !== _lastW || H !== _lastH) {
    _lastW = W; _lastH = H;
    resize();
  }
}
// [POV-V5] diagnostic A L'ECRAN: les nombres vitaux dans le panneau POV —
// visibles dans tout screenshot, plus besoin de console.
function updatePovDbg() {
  const el = document.getElementById('pov-ver');
  if (!el) return;
  const [W, H] = realSize();
  let glv = '?', tex = '';
  try {
    const gl = renderer.getContext();
    glv = /WebGL (\d)/.exec(gl.getParameter(gl.VERSION));
    glv = glv ? 'GL' + glv[1] : '?';
    const ti = povQuad && povQuad.material.map && povQuad.material.map.image;
    if (ti) tex = ' · tex ' + ti.width + 'x' + ti.height;
  } catch (e) {}
  el.textContent = 'v10 · ' + W + 'x' + H + ' · fov ' + camera.fov.toFixed(1) +
                   ' · asp ' + camera.aspect.toFixed(2) + ' · ' + glv + tex;
}

// [VIEW3D-SIMPLIFY] map toujours visible (pas un filtre); ocean et grid
// retires — inutiles avec les tuiles satellite (l'eau est dans la map).
const layers = { cams: new THREE.Group(), lms: new THREE.Group(),
                 meshes: new THREE.Group(), ground: new THREE.Group(),
                 terrain: new THREE.Group() };
Object.values(layers).forEach(g => scene.add(g));
for (const k of ['cams', 'lms', 'meshes', 'terrain']) {
  const chip = document.getElementById('ly-' + k);
  chip.addEventListener('click', () => {
    const on = chip.classList.toggle('on');
    layers[k].visible = on;
    // [HEIGHTMAP-V1] le relief REMPLACE le sol plat: les deux ensemble se
    // z-fightent sur toutes les zones basses (le sol tiles est a z=0).
    if (k === 'terrain') layers.ground.visible = !on;
  });
}

// [VIEW3D-SYNC] le parent peut envoyer le focus-cam AVANT la fin du build
// de la scene (module en await) — on bufferise et on applique apres.
let pendingFocus = null, sceneReady = false;
addEventListener('message', ev => {
  if (ev.data && ev.data.type === 'gtamaplib-focus-cam' && ev.data.name) {
    if (sceneReady) syncToCam(ev.data.name);
    else pendingFocus = ev.data.name;
  }
});

const data = await (await fetch('/api/scene3d')).json();

// ── [HEIGHTMAP-V1] terrain reel: grille metrique depuis la height map leak ──
(async () => {
  try {
    // src=hd: grille 6 m enrichie par la clean map (affichage seulement,
    // detail borne +/-5 m la ou il correle avec le vrai relief); le serveur
    // retombe sur le DDS bicubique si la couche HD n'est pas generee.
    // step=8: ~6M sommets, mesure 61 fps a step=10 sur cette machine.
    const t = await (await fetch('/api/terrain3d?src=hd&step=6')).json();
    if (t.error) { console.warn('terrain3d:', t.error); return; }
    const raw = Uint8Array.from(atob(t.z_b64), ch => ch.charCodeAt(0));
    const Z = new Float32Array(raw.buffer);
    const { nx, ny, x0, y0, step } = t;
    const pos = new Float32Array(nx * ny * 3);
    const col = new Float32Array(nx * ny * 3);
    // rampe hypsometrique: fond marin -> sable -> vert -> brun -> blanc
    function ramp(z) {
      if (z <= 0)  { const f = Math.max(0, 1 + z / 130); return [0.10*f+0.02, 0.22*f+0.04, 0.35*f+0.08]; }
      if (z < 3)   return [0.80, 0.74, 0.55];
      if (z < 60)  { const f = (z - 3) / 57;  return [0.24 - 0.06*f, 0.42 - 0.10*f, 0.20 - 0.04*f]; }
      if (z < 250) { const f = (z - 60) / 190; return [0.18 + 0.28*f, 0.32 + 0.08*f, 0.16 + 0.08*f]; }
      const f = Math.min(1, (z - 250) / 300);  return [0.46 + 0.5*f, 0.40 + 0.55*f, 0.24 + 0.7*f];
    }
    for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) {
      const k = j * nx + i, z = Z[k];
      pos[3*k]   = x0 + i * step;
      pos[3*k+1] = y0 + j * step;
      pos[3*k+2] = z;
      const c = ramp(z);
      col[3*k] = c[0]; col[3*k+1] = c[1]; col[3*k+2] = c[2];
    }
    const idx = new Uint32Array((nx - 1) * (ny - 1) * 6);
    let p = 0;
    for (let j = 0; j < ny - 1; j++) for (let i = 0; i < nx - 1; i++) {
      const a = j * nx + i, b = a + 1, c = a + nx, d = c + 1;
      idx[p++] = a; idx[p++] = b; idx[p++] = c;
      idx[p++] = b; idx[p++] = d; idx[p++] = c;
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    g.setAttribute('color', new THREE.BufferAttribute(col, 3));
    g.setIndex(new THREE.BufferAttribute(idx, 1));
    g.computeVertexNormals();
    const mat = new THREE.MeshLambertMaterial({ vertexColors: true, side: THREE.DoubleSide });
    layers.terrain.add(new THREE.Mesh(g, mat));
    // plan de mer translucide a z=0
    const seaG = new THREE.PlaneGeometry((nx-1)*step, (ny-1)*step);
    seaG.translate(x0 + (nx-1)*step/2, y0 + (ny-1)*step/2, 0);
    const sea = new THREE.Mesh(seaG, new THREE.MeshBasicMaterial({
      color: 0x1a4a6e, transparent: true, opacity: 0.55, depthWrite: false }));
    sea.renderOrder = 2;                 // toujours apres le relief
    sea.name = 'terrain-sea';
    layers.terrain.add(sea);
    window.__terrain = { mesh: layers.terrain.children[0], sea, layers, THREE, camera };  // debug hook
    // [COORDREAD-3D] grille exposee pour le readout curseur (voir plus bas)
    window.__hgrid = { Z, nx, ny, x0, y0, step };
    layers.ground.visible = false;       // le relief remplace le sol plat au chargement
    // lumiere pour le Lambert (la scene n'en avait pas forcement)
    if (!scene.getObjectByName('terrain-sun')) {
      const sun = new THREE.DirectionalLight(0xffffff, 0.9);
      sun.position.set(-8000, -6000, 12000); sun.name = 'terrain-sun';
      scene.add(sun, new THREE.AmbientLight(0xffffff, 0.45));
    }
    console.log('[HEIGHTMAP-V1] terrain', nx, 'x', ny, '@', step, 'm');
  } catch (e) { console.warn('terrain3d:', e); }
})();

// ── frustums: un LineSegments par tier (perf: 174 cams en 5 draws) ──
const byTier = {};
for (const c of data.cameras) {
  const t = c.tier || 'unverified';
  (byTier[t] = byTier[t] || []).push(c);
}
const camPickPositions = [];   // pour le raycast hover
const camPickRefs = [];
for (const [tier, cams] of Object.entries(byTier)) {
  const verts = [];
  for (const c of cams) {
    const [x, y, z] = c.xyz;
    camPickPositions.push(x, y, z);
    camPickRefs.push(c);
    if (!c.corners) continue;
    const tips = c.corners.map(d => [x + d[0] * FRUSTUM_LEN,
                                     y + d[1] * FRUSTUM_LEN,
                                     z + d[2] * FRUSTUM_LEN]);
    for (const tip of tips) verts.push(x, y, z, ...tip);          // 4 aretes apex→coin
    for (let i = 0; i < 4; i++)                                    // rectangle du fond
      verts.push(...tips[i], ...tips[(i + 1) % 4]);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
  const m = new THREE.LineBasicMaterial({ color: TIER_COLORS[tier],
    transparent: true, opacity: tier === 'unverified' ? 0.22 : 0.65 });
  layers.cams.add(new THREE.LineSegments(g, m));
}
// points invisibles aux apex pour le hover
const pickGeo = new THREE.BufferGeometry();
pickGeo.setAttribute('position', new THREE.Float32BufferAttribute(camPickPositions, 3));
const pickPts = new THREE.Points(pickGeo,
  new THREE.PointsMaterial({ size: 26, transparent: true, opacity: 0 }));
layers.cams.add(pickPts);

// ── landmarks: Points blancs discrets ──
// [VIEW3D-ZC] deux groupes: LMs libres (blanc) et contraints en z (bleu)
// — la doctrine waterline rendue visible dans l'espace.
const lmVerts = [], lmVertsZc = [];
for (const l of data.landmarks) (l.zc ? lmVertsZc : lmVerts).push(...l.xyz);
const lmGeo = new THREE.BufferGeometry();
lmGeo.setAttribute('position', new THREE.Float32BufferAttribute(lmVerts, 3));
const lmGeoZc = new THREE.BufferGeometry();
lmGeoZc.setAttribute('position', new THREE.Float32BufferAttribute(lmVertsZc, 3));
// gl_points = carres par defaut; une texture radiale les rend circulaires
const dotCan = document.createElement('canvas');
dotCan.width = dotCan.height = 64;
const dctx = dotCan.getContext('2d');
const grad = dctx.createRadialGradient(32, 32, 0, 32, 32, 30);
grad.addColorStop(0, 'rgba(232,232,242,1)');
grad.addColorStop(0.55, 'rgba(232,232,242,.9)');
grad.addColorStop(1, 'rgba(232,232,242,0)');
dctx.fillStyle = grad;
dctx.beginPath(); dctx.arc(32, 32, 30, 0, Math.PI * 2); dctx.fill();
const dotTex = new THREE.CanvasTexture(dotCan);
layers.lms.add(new THREE.Points(lmGeo, new THREE.PointsMaterial({
  map: dotTex, size: 9, transparent: true, opacity: 0.85,
  alphaTest: 0.05, depthWrite: false, sizeAttenuation: true })));
layers.lms.add(new THREE.Points(lmGeoZc, new THREE.PointsMaterial({
  map: dotTex, size: 10, color: 0x60a5fa, transparent: true, opacity: 0.95,
  alphaTest: 0.05, depthWrite: false, sizeAttenuation: true })));

// ── meshes proceduraux: chaque mesh garde SA couleur ──
// Le rendu etait en cyan uni: en 3D on ne distinguait plus un massif d'un
// autre ni d'un building. La couleur est celle du mesh (meme champ que la
// vue camera), portee par sommet pour rester sur une seule passe de dessin.
const MESH_FALLBACK = 0x67e8f9;
const meshVerts = [], meshCols = [];
const _c = new THREE.Color();
for (const m of Object.values(data.meshes || {})) {
  const list = m.world_edges || m;
  _c.set(m.color || MESH_FALLBACK);   // .set() fait deja le passage sRGB
  for (const e of list) {
    meshVerts.push(...e[0], ...e[1]);
    for (let k = 0; k < 2; k++) meshCols.push(_c.r, _c.g, _c.b);
  }
}
if (meshVerts.length) {
  const mg = new THREE.BufferGeometry();
  mg.setAttribute('position', new THREE.Float32BufferAttribute(meshVerts, 3));
  mg.setAttribute('color', new THREE.Float32BufferAttribute(meshCols, 3));
  layers.meshes.add(new THREE.LineSegments(mg, new THREE.LineBasicMaterial({
    vertexColors: true, transparent: true, opacity: 0.9 })));
}

// ── ocean z=0 + grille ──
// cadrage sur les LANDMARKS seulement: des cams aeriennes (ex. AI World
// Editor Map a z=8012m) explosent la bbox et noient la scene dans le fog.
const bb = new THREE.Box3();
for (const l of data.landmarks) bb.expandByPoint(new THREE.Vector3(...l.xyz));
const ctr = bb.getCenter(new THREE.Vector3());
const span = bb.getSize(new THREE.Vector3()).length();
// ── [VIEW3D-V2] sol: tuiles satellite drapees sur un plan ──
// Transform identique a server.world_to_tile_px: monde 32768m, origine
// (16384,16384), y flippe. Z=3 → 4 m/px, tuile = 1024m, ~400 tuiles.
const TZ = 3, TSIZE = 256, TMETERS = 32768 / (32);           // 1024m par tuile a z=3
const TR = { 3: [[0, 4], [19, 23]] }[TZ];
const [[tx0, ty0], [tx1, ty1]] = TR;
const gw = (tx1 - tx0 + 1), gh = (ty1 - ty0 + 1);
const gcan = document.createElement('canvas');
gcan.width = gw * TSIZE; gcan.height = gh * TSIZE;
const gctx = gcan.getContext('2d');
gctx.fillStyle = '#101218'; gctx.fillRect(0, 0, gcan.width, gcan.height);
const gtex = new THREE.CanvasTexture(gcan);
gtex.colorSpace = THREE.SRGBColorSpace;
gtex.anisotropy = renderer.capabilities.getMaxAnisotropy();

// ── [POSE-COPY] pose camera live (bas-gauche): vole jusqu'a repliquer une
// vue, clique le badge -> JSON {"xyz","ypr"} dans le presse-papier, colle-le
// dans le chat et la resection part de la. yaw/pitch dans la convention
// cameras.json (yaw anti-horaire depuis +y, pitch + = vers le haut).
(() => {
  const el = document.createElement('div');
  el.style.cssText = 'position:fixed;left:10px;bottom:34px;z-index:30;' +
    'background:rgba(10,10,13,.72);border:1px solid #2c2c33;border-radius:8px;' +
    'padding:5px 11px;font:11px ui-monospace,monospace;color:#facc15;' +
    'cursor:pointer;white-space:nowrap;user-select:none';
  el.title = 'clic: copier la pose (JSON) pour la donner a Claude';
  document.body.appendChild(el);
  const dirV = new THREE.Vector3();
  function pose() {
    camera.getWorldDirection(dirV);
    const yaw = ((-Math.atan2(dirV.x, dirV.y) * 180 / Math.PI) % 360 + 360) % 360;
    const pitch = Math.asin(Math.max(-1, Math.min(1, dirV.z))) * 180 / Math.PI;
    return { xyz: [ +camera.position.x.toFixed(1), +camera.position.y.toFixed(1),
                    +camera.position.z.toFixed(1) ],
             ypr: [ +yaw.toFixed(2), +pitch.toFixed(2), 0 ] };
  }
  setInterval(() => {
    const p = pose();
    el.textContent = `CAM ${p.xyz.join(', ')}  yaw ${p.ypr[0]}  pitch ${p.ypr[1]}  (clic = copier)`;
  }, 250);
  el.addEventListener('click', () => {
    const txt = JSON.stringify(pose());
    (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject())
      .then(() => { el.style.color = '#4ade80'; setTimeout(() => el.style.color = '#facc15', 700); })
      .catch(() => { prompt('copie manuelle:', txt); });
  });
})();

// ── [COORDREAD-3D] X/Y/Z monde sous le curseur (meme readout que la Map) ──
// Raymarch curseur->grille de hauteur (25 m puis bisection): pas de raycast
// sur les 245k triangles du mesh, ~1200 lookups max par mouvement.
(() => {
  const el = document.createElement('div');
  el.style.cssText = 'position:fixed;right:10px;bottom:10px;z-index:30;' +
    'background:rgba(10,10,13,.72);border:1px solid #2c2c33;border-radius:8px;' +
    'padding:5px 11px;font:11px ui-monospace,monospace;color:#4ade80;' +
    'pointer-events:none;white-space:nowrap;opacity:0;transition:opacity .12s';
  el.textContent = 'X —  Y —  Z —';
  document.body.appendChild(el);
  function gz(x, y) {
    const g = window.__hgrid;
    if (!g) return null;
    const fi = (x - g.x0) / g.step, fj = (y - g.y0) / g.step;
    if (fi < 0 || fj < 0 || fi >= g.nx - 1 || fj >= g.ny - 1) return null;
    const i = Math.floor(fi), j = Math.floor(fj), u = fi - i, v = fj - j;
    const k = j * g.nx + i;
    return g.Z[k]*(1-u)*(1-v) + g.Z[k+1]*u*(1-v) + g.Z[k+g.nx]*(1-u)*v + g.Z[k+g.nx+1]*u*v;
  }
  const rc = new THREE.Raycaster();
  let last = 0;
  renderer.domElement.addEventListener('pointermove', ev => {
    const now = performance.now();
    if (now - last < 50) return;         // throttle 20 Hz
    last = now;
    if (!window.__hgrid) return;
    const r = renderer.domElement.getBoundingClientRect();
    rc.setFromCamera({ x: (ev.clientX - r.left) / r.width * 2 - 1,
                       y: -((ev.clientY - r.top) / r.height) * 2 + 1 }, camera);
    const o = rc.ray.origin, d = rc.ray.direction;
    let t0 = 0, hit = null;
    let f0 = o.z - (gz(o.x, o.y) ?? -301);
    for (let t = 25; t < 30000; t += 25) {
      const x = o.x + d.x*t, y = o.y + d.y*t, z = o.z + d.z*t;
      const g = gz(x, y);
      const f = z - (g ?? -301);
      if (f0 > 0 && f <= 0) {            // traversee: bisection
        let a = t0, b = t;
        for (let k = 0; k < 14; k++) {
          const m = (a + b) / 2;
          const gm = gz(o.x + d.x*m, o.y + d.y*m) ?? -301;
          ((o.z + d.z*m) - gm > 0) ? a = m : b = m;
        }
        hit = (a + b) / 2;
        break;
      }
      f0 = f; t0 = t;
    }
    if (hit === null) { el.style.opacity = 0; return; }
    const hx = o.x + d.x*hit, hy = o.y + d.y*hit;
    const g = gz(hx, hy);
    el.textContent = `X ${hx.toFixed(1)}   Y ${hy.toFixed(1)}   Z ${(g === null || g < -300.5) ? '—' : g.toFixed(1)}`;
    el.style.opacity = 1;
  });
  renderer.domElement.addEventListener('pointerleave', () => { el.style.opacity = 0; });
})();

const povFrame = document.getElementById('pov-frame');   // (V4: plus utilise pour le rendu, conserve pour compat)

function killQuad() {

const povPanel = document.getElementById('pov');

// ── [POV-ZOOM-V1] reculer SANS quitter la cam ──
// Alexandre: "zoom out sans qu'on sorte de la cam, mais que l'image rapetisse
// pour voir plus de map". Reculer physiquement la camera changerait la
// parallaxe et desalignerait la frame du monde: la seule transformation qui
// preserve l'alignement depuis un point de vue fixe est d'ELARGIR le champ.
// On pose tan(F/2) = zoom * tan(vfov0/2), et la frame occupe alors exactement
// 1/zoom de la hauteur d'ecran — exact, pas approche.
let povBase = null;          // {vfov0, ratio, marks}
let povZoom = 1;
const povZoomEl = document.getElementById('pov-zoom');
const povZoomV = document.getElementById('pov-zoomv');

function povMaxZoom() {
  // on borne le ZOOM, pas le fov: un fov ecrete casserait la relation
  // ci-dessus et l'image glisserait sans que rien ne le signale.
  const v0 = THREE.MathUtils.degToRad(povBase.vfov0);
  return Math.min(6, Math.tan(THREE.MathUtils.degToRad(82.5)) / Math.tan(v0 / 2));
}
function renderPovMarks() {
  const div = document.getElementById('pov-marks');
  if (!povPrev || !povBase || !povBase.marks) return;
  const d = povBase.marks;
  div.innerHTML = '';
  const [W, H] = realSize();
  const ih = H / povZoom, iw = ih * povBase.ratio;
  const ileft = (W - iw) / 2, itop = (H - ih) / 2;   // centree en X ET en Y
  const W2 = d.size || [3840, 2160];
  for (const m of d.markings || []) {
    const fx = ileft + m.px[0] * (iw / W2[0]);
    const fy = itop + m.px[1] * (ih / W2[1]);
    const v = new THREE.Vector3(...m.xyz).project(camera);
    const wx = (v.x + 1) / 2 * W, wy = (1 - v.y) / 2 * H;
    const mk = (x, y, color, sym) => {
      const el = document.createElement('div');
      el.textContent = sym;
      el.style.cssText = 'position:absolute;left:' + (x - 7) + 'px;top:' + (y - 10) +
        'px;color:' + color + ';font:14px monospace;text-shadow:0 0 3px #000';
      div.appendChild(el);
    };
    mk(fx, fy, '#facc15', '+');
    if (v.z < 1) mk(wx, wy, '#67e8f9', 'x');
  }
}
function setPovZoom(z) {
  if (!povBase) return;
  povZoom = Math.max(1, Math.min(povMaxZoom(), z));
  const v0 = THREE.MathUtils.degToRad(povBase.vfov0);
  camera.fov = THREE.MathUtils.radToDeg(2 * Math.atan(povZoom * Math.tan(v0 / 2)));
  camera.updateProjectionMatrix();
  const h = (100 / povZoom).toFixed(4);
  povFrame.style.height = h + 'vh';
  povFrame.style.width = 'calc(' + h + 'vh * ' + povBase.ratio.toFixed(4) + ')';
  povZoomV.textContent = 'x' + povZoom.toFixed(1);
  if (document.activeElement !== povZoomEl) povZoomEl.value = Math.round(povZoom * 100);
  renderPovMarks();
  updatePovDbg();
}
povZoomEl.addEventListener('input', () => setPovZoom(+povZoomEl.value / 100));
addEventListener('wheel', ev => {
  if (!povPrev || !povBase) return;   // hors POV, la molette reste a OrbitControls
  ev.preventDefault();

}, { passive: false });
function enterPOV(c) {
  if (!c.corners) return;
  flyAnim = null;                                 // [VIEW3D-SYNC-V2] stop tout vol en cours
  const [tl, tr, br, bl] = c.corners.map(d => new THREE.Vector3(...d));
  const right = new THREE.Vector3().subVectors(tr, tl).normalize();
  const up = new THREE.Vector3().subVectors(tl, bl).normalize();
  const dir = new THREE.Vector3().add(tl).add(tr).add(br).add(bl).normalize();
  const zAxis = new THREE.Vector3().crossVectors(right, up).normalize(); // = -dir
  const yAxis = new THREE.Vector3().crossVectors(zAxis, right).normalize();
  const midTop = new THREE.Vector3().addVectors(tl, tr).normalize();
  const midBot = new THREE.Vector3().addVectors(bl, br).normalize();
  const vfov = THREE.MathUtils.radToDeg(midTop.angleTo(midBot));
  const midL = new THREE.Vector3().addVectors(tl, bl).normalize();
  const midR = new THREE.Vector3().addVectors(tr, br).normalize();
  const hfov = midL.angleTo(midR);
  if (!povPrev) povPrev = { pos: camera.position.clone(), quat: camera.quaternion.clone(),
                            fov: camera.fov, near: camera.near, target: controls.target.clone() };
  camera.position.set(...c.xyz);
  const m = new THREE.Matrix4().makeBasis(right, yAxis, zAxis);
  camera.quaternion.setFromRotationMatrix(m);
  camera.fov = vfov; camera.near = 0.5;
  camera.updateProjectionMatrix();
  camera.updateMatrixWorld(true);
  // [POV-TERRAIN-V2] le terrain RESTE visible en POV (c'est le check de pose:
  // silhouettes du relief vs frame); il suit simplement l'etat du chip.
  window.__povState = { pos: camera.position.toArray(),
                        lookDir: camera.getWorldDirection(new THREE.Vector3()).toArray(),
                        wantDir: dir.toArray(), fov: camera.fov };
  // [POV-V9] LA SIMPLICITE: la frame est une IMAGE HTML par-dessus le canvas.
  // Zero texture GPU, zero quad, zero dependance machine — du CSS deterministe.
  // Alignement: la camera POV a exactement le vfov de la frame -> la frame a
  // hauteur 100vh est angulairement exacte; largeur = 100vh x (aspect frame),
  // centree. Prouve pixel-perfect a l'ere V3 (0.1-2.3px sur 3 cams).
  killQuad();
  const ratio = Math.tan(hfov / 2) / Math.tan(THREE.MathUtils.degToRad(vfov) / 2);
  povBase = { vfov0: vfov, ratio: ratio, marks: null };
  povZoom = 1;
  setPovZoom(1);                       // pose fov, taille de la frame et l'affichage
  povFrame.style.outline = '1px solid rgba(250,204,21,.35)';
  povFrame.style.opacity = povAlpha.value / 100;
  povFrame.style.display = 'block';
  povFrame.onerror = () => { povFrame.style.display = 'none'; };
  povFrame.src = '/frame/' + encodeURIComponent(c.name);
  // [POV-MARKS] auto-preuve d'alignement: croix JAUNES = markings a leur
  // position dans la frame (via la geometrie CSS de l'img), croix CYAN =
  // meme landmarks projetes par la camera 3D. Superposees = aligne.
  const marksDiv = document.getElementById('pov-marks');
  marksDiv.style.display = 'block';
  marksDiv.innerHTML = '';
  fetch('/api/cam_markings?cam=' + encodeURIComponent(c.name))
    .then(r => r.json()).then(d => {
      if (!povPrev || !povBase) return;   // sorti du POV entre-temps
      povBase.marks = d;                  // gardees: a redessiner a chaque cran de zoom
      renderPovMarks();
    }).catch(() => {});
  updatePovDbg();
  controls.enabled = false;
  povPanel.style.display = 'flex';
  document.getElementById('pov-name').textContent = c.name;
  // overlay de la frame reelle: vfov epouse la hauteur ecran par construction
  // -> height 100vh + largeur au ratio angulaire = alignement pixel-a-pixel
}
function exitPOV() {

  camera.updateProjectionMatrix();

// ── [VIEW3D-SYNC] focus d'une cam (message du parent): marqueur + vol ──
let focusMarker = null, activeCamRef = null, flyAnim = null;
function focusCam(name) {
  const c = camPickRefs.find(c => c.name === name);
  if (!c) return false;
  activeCamRef = c;
  if (povPrev) exitPOV();
  if (!focusMarker) {
    const g = new THREE.SphereGeometry(9, 12, 8);
    focusMarker = new THREE.Mesh(g, new THREE.MeshBasicMaterial({
      color: 0xfacc15, transparent: true, opacity: 0.9 }));
    scene.add(focusMarker);
  }
  focusMarker.position.set(...c.xyz);
  focusMarker.visible = true;
  // vol: on se place derriere la cam par rapport a sa direction de visee
  let back = new THREE.Vector3(0, 0, 0);
  if (c.corners) {
    for (const d of c.corners) back.add(new THREE.Vector3(...d));
    back.normalize().multiplyScalar(-420);
  } else back.set(300, -300, 0);
  const dst = new THREE.Vector3(...c.xyz).add(back).add(new THREE.Vector3(0, 0, 160));
  const p0 = camera.position.clone(), t0 = controls.target.clone();
  const tgt = new THREE.Vector3(...c.xyz);
  const start = performance.now();
  flyAnim = () => {
    const k = Math.min(1, (performance.now() - start) / 700);
    const e = k * k * (3 - 2 * k);            // smoothstep
    camera.position.lerpVectors(p0, dst, e);
    controls.target.lerpVectors(t0, tgt, e);
    if (k >= 1) flyAnim = null;
  };
  return true;
}
// [VIEW3D-SYNC-V2] selection d'une cam depuis calib = entrer DIRECTEMENT
// dans sa vue exacte (POV + frame en opacite reglable, la demande
// d'Alexandre). Esc sort vers une vue libre placee derriere la cam (on voit
// ou elle vit dans l'espace), et de la on dezoome librement sur la map.
function syncToCam(name) {
  const c = camPickRefs.find(c => c.name === name);
  if (!c) return false;
  if (!c.corners) return focusCam(name);         // pas de frustum -> survol
  activeCamRef = c;
  if (!focusMarker) {
    focusMarker = new THREE.Mesh(new THREE.SphereGeometry(9, 12, 8),
      new THREE.MeshBasicMaterial({ color: 0xfacc15, transparent: true, opacity: 0.9 }));
    scene.add(focusMarker);
  }
  focusMarker.position.set(...c.xyz);
  focusMarker.visible = true;
  flyAnim = null;                                 // un vol en cours ne doit pas tirer sur le POV
  if (povPrev) exitPOV();
  enterPOV(c);
  // la sortie du POV atterrit derriere la cam, pas a la vue d'avant
  const back = new THREE.Vector3(0, 0, 0);
  for (const d of c.corners) back.add(new THREE.Vector3(...d));
  back.normalize().multiplyScalar(-420);
  const dst = new THREE.Vector3(...c.xyz).add(back).add(new THREE.Vector3(0, 0, 160));
  povPrev = { pos: dst, quat: camera.quaternion.clone(), fov: 55, near: 1,
              target: new THREE.Vector3(...c.xyz) };
  return true;
}

// Camera du parent (iframe). On distingue clic et drag par le deplacement.
let downAt = null;
addEventListener('pointerdown', ev => { downAt = [ev.clientX, ev.clientY]; });
addEventListener('pointerup', ev => {
  if (!downAt) return;
  const moved = Math.hypot(ev.clientX - downAt[0], ev.clientY - downAt[1]);
  downAt = null;

  const ndc = new THREE.Vector2(ev.clientX / innerWidth * 2 - 1,
                                -(ev.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hits = ray.intersectObject(pickPts);
  if (!hits.length) return;
  const c = camPickRefs[hits[0].index];
  // [POV-HOP] clic sur un frustum = on saute dans la vue de cette cam
  // (shift-clic identique — conserve par habitude), et la selection de cam
  // suit dans calib sans changer d'onglet.
  syncToCam(c.name);
  if (window.self !== window.top) {
    window.parent.postMessage({ type: 'gtamaplib-select-cam', name: c.name }, '*');
  }
});

addEventListener('pointermove', ev => {
  const ndc = new THREE.Vector2(ev.clientX / innerWidth * 2 - 1,
                                -(ev.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hits = ray.intersectObject(pickPts);
  if (hits.length) {
    const c = camPickRefs[hits[0].index];
    showHoverRays(c);                              // [VIEW3D-RAYS]
    const rms = c.rms_arcmin;
    info.style.display = 'block';
    info.innerHTML = `<b>${c.name}</b><br>` +
      `tier ${c.tier || 'unverified'} · ${c.n_pixels} markings` +
      (c.hud_locked ? ' · HUD-locked' : '') +
      (rms != null ? `<br>RMS <span class="${rms > 10 ? 'rms-bad' : ''}">${rms}&#8242;</span>` : '') +
      (c.pose_verified ? `<br><span style="color:#4ade80">&#10003; ${c.pose_verified.split(' — ')[0]}</span>` : '') +
      (c.corners ? `<br><span style="color:var(--dim)">click: jump POV</span>` : '');
  } else {
    info.style.display = 'none';
    clearHoverRays();                              // [VIEW3D-RAYS]
  }
});

addEventListener('dblclick', ev => {
  const ndc = new THREE.Vector2(ev.clientX / innerWidth * 2 - 1,
                                -(ev.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObject(ground);
  if (hit.length) { controls.target.copy(hit[0].point); }
});

// helper de test/debug: rend une frame MAINTENANT et echantillonne des pixels
window.__renderAndSample = (pts) => {
  renderer.render(scene, camera);
  const cv = renderer.domElement;
  const out = document.createElement('canvas');
  out.width = cv.width; out.height = cv.height;
  const ctx2 = out.getContext('2d');
  ctx2.drawImage(cv, 0, 0);
  const pr = cv.width / innerWidth;
  return pts.map(([x, y]) => {
    const d = ctx2.getImageData(Math.round(x * pr) - 4, Math.round(y * pr) - 4, 9, 9).data;
    let r = 0, g = 0, b = 0, n = 0;
    for (let i = 0; i < d.length; i += 4) { r += d[i]; g += d[i + 1]; b += d[i + 2]; n++; }
    return [Math.round(r / n), Math.round(g / n), Math.round(b / n)];
  });
};

// helper de test/debug: etat de la scene
window.__sceneDebug = () => {
  const mg = layers.meshes.children[0];
  let bs = null;
  if (mg) {
    mg.geometry.computeBoundingSphere();
    const s = mg.geometry.boundingSphere;
    bs = { center: s.center.toArray().map(v => +v.toFixed(0)), radius: +s.radius.toFixed(0) };
  }
  let quad = null;
  if (povQuad) {
    const p = povQuad.geometry.parameters;
    quad = { qw: +p.width.toFixed(2), qh: +p.height.toFixed(2),
             angH: +(2 * Math.atan(p.width / 2 / 120) * 180 / Math.PI).toFixed(2),
             angV: +(2 * Math.atan(p.height / 2 / 120) * 180 / Math.PI).toFixed(2) };
  }
  const gl = renderer.getContext();
  const timg = povQuad && povQuad.material.map && povQuad.material.map.image;
  return { gl: gl.getParameter(gl.VERSION), maxTex: gl.getParameter(gl.MAX_TEXTURE_SIZE),
           texImage: timg ? [timg.width, timg.height] : null,
           fog: scene.fog ? { near: +scene.fog.near.toFixed(0), far: +scene.fog.far.toFixed(0) } : null,
           span: +span.toFixed(0), meshesVisible: layers.meshes.visible,
           nMeshVerts: mg ? mg.geometry.attributes.position.count : 0,
           camFar: camera.far, camNear: camera.near, camFov: +camera.fov.toFixed(2),
           camAspect: +camera.aspect.toFixed(3), win: [innerWidth, innerHeight], quad, bs };
};

// helper de test/debug: ou un pixel de FRAME (u,v de l'image) atterrit a
// l'ecran via le QUAD — a comparer avec __projectPoint du meme landmark
window.__quadPointScreen = (fx, fy, fw, fh) => {
  if (!povQuad) return null;
  const p = povQuad.geometry.parameters;
  const local = new THREE.Vector3((fx / fw - 0.5) * p.width,
                                  (0.5 - fy / fh) * p.height, 0);
  const world = povQuad.localToWorld(local);
  const v = world.project(camera);
  const [W, H] = realSize();
  return { x: (v.x + 1) / 2 * W, y: (1 - v.y) / 2 * H };
};

// helper de test/debug: projette un point monde -> pixels ecran
window.__projectPoint = (x, y, z) => {
  const v = new THREE.Vector3(x, y, z);
  v.project(camera);
  const [W, H] = realSize();
  return { x: (v.x + 1) / 2 * W, y: (1 - v.y) / 2 * H, behind: v.z > 1 };
};

// helper de test/debug: etat des rayons de hover
window.__hoverRaysCount = () => hoverRays ? hoverRays.geometry.attributes.position.count / 2 : 0;

// helper de test/debug: position ecran d'une cam par nom
window.__camScreen = name => {
  const i = camPickRefs.findIndex(c => c.name === name);
  if (i < 0) return null;
  const v = new THREE.Vector3(camPickPositions[i*3], camPickPositions[i*3+1], camPickPositions[i*3+2]);
  v.project(camera);
  return { x: (v.x + 1) / 2 * innerWidth, y: (1 - v.y) / 2 * innerHeight, behind: v.z > 1 };
};

renderer.setAnimationLoop(() => {
  sizeGuard();                                  // [POV-V4] auto-reparation de taille
  if (flyAnim) flyAnim();                       // [VIEW3D-SYNC] vol vers la cam
  // en POV la camera est pilotee par nous: controls.update() la re-orienterait
  // vers sa cible a chaque frame (meme controls.enabled=false) -> monde noir
  if (!povPrev) controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
