<!doctype html>
<!-- [VIEW3D-V1] Vue 3D du reseau de calibration.
     Frustums des cams (couleur = tier de confiance), landmarks, meshes
     proceduraux, plan d'ocean a z=0 (le datum que les iles des Keys ont
     viole pendant des mois sans que personne le voie — cette vue existe
     pour que ca n'arrive plus jamais).
     Donnees: /api/scene3d (coins de frustum calcules par gtamaplib serveur-
     side, zero replication de convention ypr en JS). three.js vendorise. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>gtamaplib — 3D</title>
<style>
  :root { --bg:#0a0a0c; --surface:#13131a; --surface2:#1c1c26; --border:#252535;
          --green:#4ade80; --red:#f87171; --text:#e2e2f0; --dim:#5a5a7a;
          --mid:#9090b0; --mono:'JetBrains Mono',monospace; }
  html, body { margin:0; height:100%; background:var(--bg); overflow:hidden;
               font:11px var(--mono); color:var(--mid); }
  #c { position:fixed; inset:0; width:100%; height:100%; } /* [POV-V10] SANS width/height CSS, un canvas (element remplace) s affiche a sa taille INTERNE (= 2x viewport avec pixelRatio 2) ancre haut-gauche -> on voyait le quart haut-gauche zoome 2x. LA cause de toute la saga zoom. */
  .panel { position:fixed; z-index:10; background:rgba(19,19,26,.88);
           backdrop-filter:blur(8px); border:1px solid var(--border);
           border-radius:10px; padding:10px 12px; }
  #hud { top:12px; left:12px; display:flex; align-items:center; gap:12px; }
  #hud .sect { color:var(--dim); font-size:9.5px; letter-spacing:.12em;
               text-transform:uppercase; margin:0; }
  #hud .chips { display:flex; flex-wrap:nowrap; gap:6px; }
  .lchip { font:11px var(--mono); padding:3px 10px; border-radius:12px;
           background:var(--surface2); border:1px solid var(--border);
           color:var(--dim); cursor:pointer; user-select:none;
           transition:color .12s, border-color .12s; }
  .lchip:hover { color:var(--mid); }
  .lchip.on { color:var(--green); border-color:rgba(74,222,128,.45); }
  #info { top:12px; right:12px; display:none; max-width:280px; color:var(--mid); }
  #info b { color:var(--text); }
  #info .rms-bad { color:var(--red); }
  #legend { bottom:12px; left:12px; display:flex; gap:13px; padding:7px 14px; }
  #env { right:12px; bottom:44px; display:flex; flex-direction:column; gap:5px; }
  #env label { display:flex; align-items:center; gap:8px; justify-content:space-between; }
  #env input[type=range] { width:92px; accent-color:#facc15; }
  #env .v { color:var(--text); min-width:34px; text-align:right; }
  .sw { display:inline-block; width:8px; height:8px; border-radius:50%;
        margin-right:6px; vertical-align:-1px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="panel" id="hud">
  <div class="sect">Layers</div>
  <div class="chips">
    <span class="lchip on" id="ly-cams">cams</span>
    <span class="lchip on" id="ly-lms">landmarks</span>
    <span class="lchip on" id="ly-meshes">meshes</span>
    <span class="lchip on" id="ly-terrain" title="Terrain reel (height map L16 du leak, z=706.07v-301.01)">terrain</span>
    <span class="lchip" id="ly-leakmap" title="Fond de carte: full map leak (composite sur yanis)">leak map</span>
    <span class="lchip" id="ly-drape" title="Draper la map 2D sur le relief (lacs, routes, details — source du chip leak map)">drape 2D</span>
    <span class="lchip" id="ly-contours" title="Courbes de niveau (50 m fortes, 10 m fines) sur le relief">contours</span>
    <span class="lchip" id="btn-shot" title="PNG de la vue + frame en medaillon">&#8681; shot</span>
  </div>
</div>
<div class="panel" id="info"></div>
<!-- [VIEW3D-POV] vue a travers une cam: position/orientation/fov exacts -->
<!-- [POV-ZOOM-V1] centre en X ET en Y: a zoom 1 la frame fait 100vh et top:50%
     translateY(-50%) est identique a top:0 ; des qu'elle rapetisse il faut
     qu'elle reste centree sur l'axe optique, sinon elle glisse vers le haut. -->
<img id="pov-frame" style="display:none;position:fixed;top:50%;left:50%;
     transform:translate(-50%,-50%);height:100vh;z-index:5;pointer-events:none;opacity:.5">
<div id="pov-marks" style="position:fixed;inset:0;z-index:6;pointer-events:none;display:none"></div>
<div class="panel" id="pov" style="display:none;top:12px;left:50%;transform:translateX(-50%);
     z-index:11;align-items:center;gap:10px">
  <b id="pov-name" style="color:var(--text)"></b>
  <label style="margin-left:10px">frame <input id="pov-alpha" type="range" min="0" max="100"
         value="50" style="width:90px;vertical-align:middle"></label>
  <label style="margin-left:10px" title="[POSE-EDIT] hypothese de fov de la cam: la frame reste plein cadre, le relief derriere s'adapte — quand ils collent, Save">fov <input id="pov-fov" type="range" min="60" max="160" value="100" style="width:70px"></label>
  <span id="pov-fov-v" style="color:#facc15;font-size:10px"></span>
  <label style="margin-left:8px" title="[POSE-EDIT] hypothese de yaw: tourne le monde derriere la frame, +/-15 deg">yaw <input id="pov-yaw" type="range" min="-1500" max="1500" value="0" style="width:80px"></label>
  <span id="pov-yaw-v" style="color:#facc15;font-size:10px"></span>
  <label style="margin-left:8px" title="[POSE-EDIT] hypothese de pitch, +/-15 deg">pitch <input id="pov-pitch" type="range" min="-1500" max="1500" value="0" style="width:80px"></label>
  <span id="pov-pitch-v" style="color:#facc15;font-size:10px"></span>
  <button id="pov-fov-save" style="background:#166534;color:#dcfce7;border:1px solid #22c55e;border-radius:4px;font-size:10px;cursor:pointer">Save</button>
  <label style="margin-left:10px" title="scroll: widens the field of view without moving the camera — the frame shrinks by the same factor and stays aligned">zoom out <input id="pov-zoom" type="range" min="100" max="600"
         value="100" style="width:110px;vertical-align:middle"></label>
  <span id="pov-zoomv" style="color:var(--dim);font-size:10px">x1.0</span>
  <button id="pov-exit" style="margin-left:10px;background:var(--surface2);color:var(--text);
          border:1px solid var(--border);border-radius:5px;padding:2px 10px;cursor:pointer;
          font:11px var(--mono)">exit (Esc)</button>
  <!-- tag de version: si tu ne vois pas ce numero, tu tournes du vieux code -->
  <span id="pov-ver" style="color:var(--dim);font-size:9px;margin-left:8px">v4</span>
</div>
<!-- [BEAUTY-V1] environnement: soleil et brume pilotent ciel + relief + mer -->
<div class="panel" id="env">
  <div class="sect">Environnement</div>
  <label title="Azimut du soleil (0 = nord, sens horaire)">soleil az
    <input id="env-az" type="range" min="0" max="359" step="1"><span class="v" id="env-az-v"></span></label>
  <label title="Hauteur du soleil — bas = lumiere rasante et teintes chaudes">hauteur
    <input id="env-el" type="range" min="4" max="80" step="1"><span class="v" id="env-el-v"></span></label>
  <label title="Brume atmospherique (distance de visibilite)">brume
    <input id="env-haze" type="range" min="0" max="100" step="1"><span class="v" id="env-haze-v"></span></label>
</div>
<div class="panel" id="legend">
  <span><span class="sw" style="background:#a78bfa"></span>anchor</span>
  <span style="margin-left:10px"><span class="sw" style="background:#4ade80"></span>high</span>
  <span style="margin-left:10px"><span class="sw" style="background:#fbbf24"></span>medium</span>
  <span style="margin-left:10px"><span class="sw" style="background:#fb923c"></span>low</span>
  <span style="margin-left:10px"><span class="sw" style="background:#6b7280"></span>unverified</span>
  <span style="margin-left:14px"><span class="sw" style="background:#60a5fa"></span>z-constrained LM</span>
</div>
<!-- [POV-V5] toute erreur JS devient VISIBLE: plus d'ecran noir muet -->
<div id="jserr" style="display:none;position:fixed;left:12px;bottom:52px;z-index:99;
     background:#7f1d1dee;color:#fecaca;font:11px monospace;padding:8px 12px;
     border-radius:8px;max-width:80vw;white-space:pre-wrap"></div>
<script>
addEventListener('error', e => {
  const el = document.getElementById('jserr');
  el.style.display = 'block';
  el.textContent = 'JS ERROR: ' + (e.message || e.type) + '\n' + (e.filename || '') + ':' + (e.lineno || '');
});
addEventListener('unhandledrejection', e => {
  const el = document.getElementById('jserr');
  if (el.style.display === 'block') return;   // un message explique est deja affiche
  el.style.display = 'block';
  el.textContent = 'PROMISE REJECT: ' + (e.reason && e.reason.message || e.reason);
});
</script>
<script type="importmap">
{ "imports": { "three": "/threejs/three.module.min.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// [VIEW3D-TAB] en iframe (onglet 3D de calib), le lien "← calib" est
// redondant et ouvrirait l'app dans l'app — on le masque.
// (HUD v2: plus de lien calib — rien a masquer en iframe)
import { MapControls } from '/threejs/MapControls.js';

const TIER_COLORS = { anchor: 0xa78bfa, high: 0x4ade80, medium: 0xfbbf24,
                      low: 0xfb923c, unverified: 0x6b7280 };
const FRUSTUM_LEN = 260;   // metres
const canvas = document.getElementById('c');
// [POV-V6] Safari limite les contextes WebGL par page et tue les plus vieux
// (l'erreur d'Alexandre: getShaderPrecisionFormat sur contexte null apres
// une journee de reloads). On echoue PROPREMENT et on survit a la perte.
function showErr(msg) {
  const el = document.getElementById('jserr');
  el.style.display = 'block';
  el.textContent = msg;
}
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'default',
    logarithmicDepthBuffer: true });  // [HEIGHTMAP-V1] 20 km de scene: sans ca, z-fighting terrain/tiles
} catch (e) {
  showErr('WebGL INDISPONIBLE — Safari a refuse le contexte (limite de contextes/GPU).\n' +
          'Ferme des onglets lourds (cartes, videos), ou utilise Chrome pour le mode 3D.\n(' + (e.message || e) + ')');
  const rb = document.createElement('button');
  rb.textContent = 'reessayer';
  rb.style.cssText = 'display:block;margin-top:8px;padding:4px 12px;cursor:pointer;' +
    'background:#450a0a;color:#fecaca;border:1px solid #fecaca;border-radius:5px;font:11px monospace';
  rb.onclick = () => location.reload();
  document.getElementById('jserr').appendChild(rb);
  throw e;
}
canvas.addEventListener('webglcontextlost', ev => {
  ev.preventDefault();   // permet la restauration automatique par three.js
  showErr('Contexte WebGL perdu (trop d\'onglets/contextes) — tentative de recuperation...');
});
canvas.addEventListener('webglcontextrestored', () => {
  const el = document.getElementById('jserr');
  el.style.display = 'none';
  resize();
});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a0c);   // remplace par applyEnv() des l'init

// Monde z-up (convention gtamaplib)
const camera = new THREE.PerspectiveCamera(55, 1, 1, 50000);
camera.up.set(0, 0, 1);
// [VIEW3D-V2] MapControls: drag = pan (feel d'app de carte), clic droit =
// orbite, zoom vers le curseur, double-clic = recentrer la cible au sol.
const controls = new MapControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.zoomToCursor = true;
controls.screenSpacePanning = false;
controls.zoomSpeed = 3.0;
controls.panSpeed = 3.0;
controls.rotateSpeed = 1.0;
controls.maxPolarAngle = Math.PI * 0.495;   // jamais sous le sol

// ── [BEAUTY-V1] environnement: ciel, soleil, brume ──
// Le rendu passe de "maquette sombre" a "monde": dome de ciel en degrade
// (zenith->horizon, halo de soleil, teintes chaudes quand le soleil baisse),
// brume accordee a la couleur d'horizon, et un soleil REGLABLE qui eclaire
// le relief (hillshade) et la mer (glint speculaire).
const ENV = Object.assign({ az: 215, el: 38, haze: 30 },
  JSON.parse(localStorage.getItem('ui.env3d') || '{}'));
const _lin = c => c.map(v => Math.pow(v, 2.2));   // sRGB -> lineaire (les shaders travaillent en lineaire)
function skyColors() {
  // t: 0 = couchant (teintes chaudes), 1 = plein jour
  const t = Math.min(1, Math.max(0, (ENV.el - 4) / 30));
  const L = (a, b) => a.map((v, i) => v + (b[i] - v) * t);
  return { zen: _lin(L([0.28, 0.33, 0.52], [0.34, 0.56, 0.86])),
           hor: _lin(L([0.99, 0.66, 0.42], [0.79, 0.87, 0.94])),
           sun: _lin(L([1.00, 0.58, 0.26], [1.00, 0.96, 0.88])) };
}
function sunDirVec() {   // vecteur VERS le soleil; az horaire depuis le nord (+y)
  const az = ENV.az * Math.PI / 180, el = ENV.el * Math.PI / 180;
  return new THREE.Vector3(Math.sin(az) * Math.cos(el),
                           Math.cos(az) * Math.cos(el), Math.sin(el));
}
// uniforms PARTAGES, crees avant tout chargement async: les chips/sliders
// peuvent les referencer meme si le terrain n'est pas encore arrive.
const terraUni = THREE.UniformsUtils.merge([THREE.UniformsLib.fog, {
  uSunDir:   { value: new THREE.Vector3(0, 0, 1) },
  uDrape:    { value: null },
  uUseDrape: { value: 0 },
  uContours: { value: 0 },
  uTerrBounds: { value: new THREE.Vector4(-1e7, -1e7, 1e7, 1e7) },
  // rect MESURE du DDS (georef rlx): au-dela, la bathymetrie est inferee
  // (rampes cotieres TERRAIN-EXTEND) — on la fond vers l'abysse plutot que
  // d'exposer des plateaux fabriques dans l'ocean
  uMeasBounds: { value: new THREE.Vector4(-13325.6, -9735.9, 5138.6, 11276.7) },
}]);
const seaUni = THREE.UniformsUtils.merge([THREE.UniformsLib.fog, {
  uSunDir:   { value: new THREE.Vector3(0, 0, 1) },
  uTime:     { value: 0 },
  uHorizon:  { value: new THREE.Vector3(.7, .8, .9) },
  uZenith:   { value: new THREE.Vector3(.25, .45, .8) },
  uSunColor: { value: new THREE.Vector3(1, 1, 1) },
  uTerrBounds: { value: new THREE.Vector4(-1e7, -1e7, 1e7, 1e7) },  // x0,y0,x1,y1 du crop terrain
}]);
const skyUni = {
  uZenith:   { value: new THREE.Vector3() },
  uHorizon:  { value: new THREE.Vector3() },
  uSunColor: { value: new THREE.Vector3() },
  uSunDir:   { value: new THREE.Vector3() },
};
// dome de ciel: suit la camera (repositionne chaque frame), pas de depth —
// dessine en premier, tout le reste passe par-dessus.
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(42000, 48, 24),
  new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, depthTest: false, fog: false,
    uniforms: skyUni,
    vertexShader: `
      varying vec3 vDir;
      void main() {
        vDir = position;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }`,
    fragmentShader: `
      varying vec3 vDir;
      uniform vec3 uZenith, uHorizon, uSunColor, uSunDir;
      void main() {
        vec3 d = normalize(vDir);
        vec3 col = mix(uHorizon, uZenith, pow(clamp(d.z, 0.0, 1.0), 0.55));
        col = mix(col, uHorizon * 0.55, smoothstep(0.0, -0.12, d.z));  // sous l'horizon: assombri
        float s = max(dot(d, uSunDir), 0.0);
        col += uSunColor * (pow(s, 1400.0) * 1.5 + pow(s, 24.0) * 0.10 + pow(s, 3.0) * 0.05);
        gl_FragColor = vec4(col, 1.0);
        #include <colorspace_fragment>
      }`}));
sky.renderOrder = -10;
sky.frustumCulled = false;
scene.add(sky);
let sceneSpan = 18000;   // provisoire; remplace par le vrai span apres chargement
function applyEnv() {
  const { zen, hor, sun } = skyColors();
  const sd = sunDirVec();
  skyUni.uZenith.value.fromArray(zen);   skyUni.uHorizon.value.fromArray(hor);
  skyUni.uSunColor.value.fromArray(sun); skyUni.uSunDir.value.copy(sd);
  terraUni.uSunDir.value.copy(sd);
  seaUni.uSunDir.value.copy(sd);
  seaUni.uHorizon.value.fromArray(hor);  seaUni.uZenith.value.fromArray(zen);
  seaUni.uSunColor.value.fromArray(sun);
  const h = ENV.haze / 100;
  const fogC = new THREE.Color(hor[0], hor[1], hor[2]);   // deja lineaire
  if (!scene.fog) scene.fog = new THREE.Fog(fogC.clone(), 1e6, 2e6);
  scene.fog.color.copy(fogC);
  scene.fog.near = sceneSpan * (2.2 - 1.9 * h);
  scene.fog.far  = sceneSpan * (7.0 - 5.2 * h);
  scene.background = fogC;
  localStorage.setItem('ui.env3d', JSON.stringify(ENV));
}
for (const [id, key, suf] of [['env-az', 'az', '°'], ['env-el', 'el', '°'],
                              ['env-haze', 'haze', '%']]) {
  const s = document.getElementById(id), v = document.getElementById(id + '-v');
  s.value = ENV[key]; v.textContent = ENV[key] + suf;
  s.addEventListener('input', () => {
    ENV[key] = +s.value; v.textContent = s.value + suf; applyEnv();
  });
}
applyEnv();

function realSize() {
  // [POV-V5] la verite de taille = le canvas mesure. innerWidth/innerHeight
  // peuvent mentir en iframe (mesure chez Alexandre: 1471x78 avec un ecran
  // plein) — le rect CSS du canvas, lui, ne ment pas.
  // [POV-V7] mesure du DOCUMENT, pas du canvas: le canvas est fixed (hors
  // flux), le document ne peut pas heriter de sa taille -> AUCUNE boucle de
  // retroaction possible (Chrome d'Alexandre: rect du canvas non contraint
  // un instant -> taille interne reinjectee -> doublement/frame -> 2^24).
  let W = Math.round(document.documentElement.clientWidth) || innerWidth;
  let H = Math.round(document.documentElement.clientHeight) || innerHeight;
  W = Math.min(W, 8192); H = Math.min(H, 8192);   // garde-fou absolu
  if (W < 8 || H < 8) { W = 1280; H = 720; }
  return [W, H];
}
function resize() {
  const [W, H] = realSize();
  renderer.setSize(W, H, false);
  camera.aspect = W / H;
  camera.updateProjectionMatrix();
  updatePovDbg();
}
addEventListener('resize', resize); resize();
// [POV-V4] garde-taille par frame: en iframe, la transition display:none ->
// block peut rater l'evenement resize (mesure chez Alexandre: iframe a
// 1471x78 alors que l'ecran est plein) — on verifie a chaque tick et on
// s'auto-repare.
let _lastW = 0, _lastH = 0;
function sizeGuard() {
  const [W, H] = realSize();
  if (W !== _lastW || H !== _lastH) {
    _lastW = W; _lastH = H;
    resize();
  }
}
// [POV-V5] diagnostic A L'ECRAN: les nombres vitaux dans le panneau POV —
// visibles dans tout screenshot, plus besoin de console.
function updatePovDbg() {
  const el = document.getElementById('pov-ver');
  if (!el) return;
  const [W, H] = realSize();
  let glv = '?', tex = '';
  try {
    const gl = renderer.getContext();
    glv = /WebGL (\d)/.exec(gl.getParameter(gl.VERSION));
    glv = glv ? 'GL' + glv[1] : '?';
    const ti = povQuad && povQuad.material.map && povQuad.material.map.image;
    if (ti) tex = ' · tex ' + ti.width + 'x' + ti.height;
  } catch (e) {}
  el.textContent = 'v10 · ' + W + 'x' + H + ' · fov ' + camera.fov.toFixed(1) +
                   ' · asp ' + camera.aspect.toFixed(2) + ' · ' + glv + tex;
}

// [VIEW3D-SIMPLIFY] map toujours visible (pas un filtre); ocean et grid
// retires — inutiles avec les tuiles satellite (l'eau est dans la map).
const layers = { cams: new THREE.Group(), lms: new THREE.Group(),
                 meshes: new THREE.Group(), ground: new THREE.Group(),
                 terrain: new THREE.Group() };
Object.values(layers).forEach(g => scene.add(g));
for (const k of ['cams', 'lms', 'meshes', 'terrain']) {
  const chip = document.getElementById('ly-' + k);
  chip.addEventListener('click', () => {
    const on = chip.classList.toggle('on');
    layers[k].visible = on;
    // [HEIGHTMAP-V1] le relief REMPLACE le sol plat: les deux ensemble se
    // z-fightent sur toutes les zones basses (le sol tiles est a z=0).
    if (k === 'terrain') layers.ground.visible = !on;
  });
}

// [VIEW3D-SYNC] le parent peut envoyer le focus-cam AVANT la fin du build
// de la scene (module en await) — on bufferise et on applique apres.
let pendingFocus = null, sceneReady = false;
addEventListener('message', ev => {
  if (ev.data && ev.data.type === 'gtamaplib-focus-cam' && ev.data.name) {
    if (sceneReady) syncToCam(ev.data.name);
    else pendingFocus = ev.data.name;
  }
});

const data = await (await fetch('/api/scene3d')).json();

// ── [HEIGHTMAP-V1] terrain reel: grille metrique depuis la height map leak ──
(async () => {
  try {
    // src=hd: grille 6 m (u16 quantifie, ~26 MB); retry puis repli en 12 m
    // si le transfert echoue (Safari lache les gros payloads).
    async function fetchTerrain() {
      for (const [stp, wait] of [[6, 0], [6, 1500], [12, 1500]]) {
        if (wait) await new Promise(r => setTimeout(r, wait));
        try {
          const r = await fetch(`/api/terrain3d?src=hd&step=${stp}`);
          if (r.ok) return await r.json();
        } catch (e) { console.warn(`terrain step=${stp}:`, e); }
      }
      throw new Error('terrain injoignable apres 3 essais');
    }
    const t = await fetchTerrain();
    if (t.error) { console.warn('terrain3d:', t.error); return; }
    let Z;
    if (t.z_u16_b64) {
      const raw = Uint8Array.from(atob(t.z_u16_b64), ch => ch.charCodeAt(0));
      const U = new Uint16Array(raw.buffer);
      Z = new Float32Array(U.length);
      for (let i = 0; i < U.length; i++) Z[i] = U[i] * t.z_scale + t.z_offset;
    } else {
      const raw = Uint8Array.from(atob(t.z_b64), ch => ch.charCodeAt(0));
      Z = new Float32Array(raw.buffer);
    }
    const { nx, ny, x0, y0, step } = t;
    const pos = new Float32Array(nx * ny * 3);
    // [BATHY-DISPLAY] le DDS n'a PAS de bathymetrie en eau libre: no-data =
    // -301, et la frontiere donnees/-301 dessinait des falaises rectangulaires
    // sous l'ocean. On fabrique un z D'AFFICHAGE: pente douce (5%) qui part de
    // la derniere valeur reelle (chamfer porteur de valeur, O(n), 2 passes),
    // plancher -140. Z (la verite) n'est PAS modifie — COORDREAD et le
    // raymarch continuent de lire le vrai (-301 = "Z —").
    let zDisp;
    {
      const NDATA = -250;
      const n = nx * ny;
      const dd = new Float32Array(n);
      const zr = new Float32Array(n);
      // [SEAM-NORD] au nord de y=9400 la grille ne contient AUCUNE terre
      // reelle (max mesure: 0.94 m) — ce qui depasse -2 m la-bas est le ruban
      // de couture TERRAIN-EXTEND (plateau fabrique a +0.74 le long de
      // l'ancien bord de map y=9736, 12 km de "plage" rectiligne) -> no-data
      // pour l'affichage, l'ocean le remplace. Z verite intact.
      for (let j = 0; j < ny; j++) {
        const north = (y0 + j * step) > 9400;
        for (let i = 0; i < nx; i++) {
          const k = j * nx + i, z = Z[k];
          if (z > NDATA && !(north && z > -2.0)) { dd[k] = 0; zr[k] = z; }
          else { dd[k] = 1e9; zr[k] = -80; }
        }
      }
      const D = step, DG = step * 1.41421356;
      for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) {   // passe avant
        const k = j * nx + i;
        if (dd[k] === 0) continue;
        let bd = dd[k], bz = zr[k], c;
        if (i > 0 && (c = dd[k-1] + D) < bd) { bd = c; bz = zr[k-1]; }
        if (j > 0) {
          if ((c = dd[k-nx] + D) < bd) { bd = c; bz = zr[k-nx]; }
          if (i > 0 && (c = dd[k-nx-1] + DG) < bd) { bd = c; bz = zr[k-nx-1]; }
          if (i < nx-1 && (c = dd[k-nx+1] + DG) < bd) { bd = c; bz = zr[k-nx+1]; }
        }
        dd[k] = bd; zr[k] = bz;
      }
      for (let j = ny-1; j >= 0; j--) for (let i = nx-1; i >= 0; i--) {   // passe arriere
        const k = j * nx + i;
        if (dd[k] === 0) continue;
        let bd = dd[k], bz = zr[k], c;
        if (i < nx-1 && (c = dd[k+1] + D) < bd) { bd = c; bz = zr[k+1]; }
        if (j < ny-1) {
          if ((c = dd[k+nx] + D) < bd) { bd = c; bz = zr[k+nx]; }
          if (i < nx-1 && (c = dd[k+nx+1] + DG) < bd) { bd = c; bz = zr[k+nx+1]; }
          if (i > 0 && (c = dd[k+nx-1] + DG) < bd) { bd = c; bz = zr[k+nx-1]; }
        }
        dd[k] = bd; zr[k] = bz;
      }
      zDisp = k => dd[k] === 0 ? Z[k]
        : Math.max(-140, Math.min(zr[k], -2) - dd[k] * 0.05);
    }
    // [BEAUTY-V1] plus de couleurs par sommet: la palette est calculee
    // per-pixel dans le shader (plus fine, et ~120 MB de RAM economises)
    for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) {
      const k = j * nx + i;
      pos[3*k]   = x0 + i * step;
      pos[3*k+1] = y0 + j * step;
      // jupe de bord: les 400 derniers metres du grid plongent sous la mer —
      // sans ca, la rangee frontiere de l'extension (z legerement > 0)
      // dessinait une fausse plage rectiligne au-dessus de l'ocean
      const db = Math.min(i, nx - 1 - i, j, ny - 1 - j) * step;
      let z = zDisp(k);
      if (db < 400) {
        const f = db / 400, s = f * f * (3 - 2 * f);
        z = -18 + (z + 18) * s;
      }
      pos[3*k+2] = z;
    }
    zDisp = null;   // libere dd/zr (fermeture)
    const idx = new Uint32Array((nx - 1) * (ny - 1) * 6);
    let p = 0;
    for (let j = 0; j < ny - 1; j++) for (let i = 0; i < nx - 1; i++) {
      const a = j * nx + i, b = a + 1, c = a + nx, d = c + 1;
      idx[p++] = a; idx[p++] = b; idx[p++] = c;
      idx[p++] = b; idx[p++] = d; idx[p++] = c;
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    g.setIndex(new THREE.BufferAttribute(idx, 1));
    g.computeVertexNormals();
    // [BEAUTY-V1] shader terrain unique (couleur OU drape via uniform — un
    // seul programme, compile une fois: la lecon [DRAPE-MAT] est structurelle).
    // Palette Leonida per-pixel: fonds marins turquoise->abysse, sable, verts
    // de Floride, roche sur pentes raides; bruit de valeur pour casser les
    // bandes; hillshade solaire + terme hemispherique; courbes de niveau
    // optionnelles (50 m fortes / 10 m fines, anti-aliasees par fwidth).
    const mat = new THREE.ShaderMaterial({
      side: THREE.DoubleSide, fog: true, uniforms: terraUni,
      vertexShader: `
        varying vec3 vPos; varying vec3 vN; varying vec2 vUv;
        #include <common>
        #include <logdepthbuf_pars_vertex>
        #include <fog_pars_vertex>
        void main() {
          vPos = position; vN = normal; vUv = uv;
          vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
          gl_Position = projectionMatrix * mvPosition;
          #include <logdepthbuf_vertex>
          #include <fog_vertex>
        }`,
      fragmentShader: `
        varying vec3 vPos; varying vec3 vN; varying vec2 vUv;
        uniform vec3 uSunDir;
        uniform sampler2D uDrape;
        uniform float uUseDrape, uContours;
        uniform vec4 uTerrBounds, uMeasBounds;
        #include <common>
        #include <logdepthbuf_pars_fragment>
        #include <fog_pars_fragment>
        vec3 srgb(vec3 c) { return pow(c, vec3(2.2)); }
        float hash2(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
        float vnoise(vec2 p) {
          vec2 i = floor(p), f = fract(p);
          f = f * f * (3.0 - 2.0 * f);
          return mix(mix(hash2(i), hash2(i + vec2(1, 0)), f.x),
                     mix(hash2(i + vec2(0, 1)), hash2(i + vec2(1, 1)), f.x), f.y);
        }
        vec3 landColor(float z, float slope, vec2 xy) {
          float n = vnoise(xy * 0.013) * 0.6 + vnoise(xy * 0.11) * 0.4;
          // jitter proportionnel a l'altitude: un jitter fixe de +/-8 m
          // noyait toutes les basses terres (0-8 m = la moitie de l'ile)
          // dans le sable
          float zz = z + (n - 0.5) * min(16.0, 1.5 + z * 0.30);
          vec3 sand   = srgb(vec3(0.85, 0.78, 0.58));
          vec3 grass  = srgb(vec3(0.36, 0.53, 0.27));
          vec3 forest = srgb(vec3(0.16, 0.33, 0.15));
          vec3 dry    = srgb(vec3(0.52, 0.47, 0.28));
          vec3 rock   = srgb(vec3(0.47, 0.41, 0.35));
          vec3 c = sand;
          c = mix(c, grass,  smoothstep(0.6, 2.4, zz));
          c = mix(c, forest, smoothstep(15.0, 95.0, zz));
          c = mix(c, dry,    smoothstep(130.0, 270.0, zz));
          c = mix(c, rock,   smoothstep(250.0, 385.0, zz));
          c = mix(c, rock * 0.92, smoothstep(0.35, 0.75, slope));   // pentes raides = roche
          c *= 0.90 + 0.20 * vnoise(xy * 0.041);        // micro-variation
          return c;
        }
        vec3 seabedColor(float z, vec2 xy) {
          float d = clamp(-z / 90.0, 0.0, 1.0);
          vec3 shallow = srgb(vec3(0.34, 0.62, 0.60));
          vec3 deep    = srgb(vec3(0.03, 0.12, 0.24));
          vec3 c = mix(shallow, deep, pow(d, 0.6));
          return c * (0.94 + 0.12 * vnoise(xy * 0.03));
        }
        void main() {
          #include <logdepthbuf_fragment>
          vec3 n = normalize(vN);
          float slope = clamp(1.0 - n.z, 0.0, 1.0);
          vec3 base;
          if (uUseDrape > 0.5) {
            base = texture2D(uDrape, vUv).rgb;
            // en mer (z<0) le fond est entierement procedural: l'ocean de la
            // map 2D est une couleur plate dont les frontieres de couverture
            // dessinaient des rectangles — la map ne garde que les eaux
            // interieures (lacs/rivieres, au-dessus de z=0)
            if (vPos.z < 0.0)
              base = mix(base * vec3(0.72, 0.88, 1.0),
                         seabedColor(vPos.z, vPos.xy),
                         smoothstep(0.0, 2.5, -vPos.z));
          } else {
            base = vPos.z > 0.0 ? landColor(vPos.z, slope, vPos.xy)
                                : seabedColor(vPos.z, vPos.xy);
          }
          float diff = max(dot(n, uSunDir), 0.0);
          float back = max(dot(n, normalize(vec3(-uSunDir.x, -uSunDir.y, 0.4))), 0.0);
          float amb  = 0.30 + 0.22 * clamp(n.z, 0.0, 1.0);
          // en drape la map reste lisible (plancher de lumiere plus haut)
          float lum = uUseDrape > 0.5 ? (0.58 + 0.48 * diff + 0.07 * back)
                                      : (amb + 0.85 * diff + 0.10 * back);
          vec3 lit = base * lum;
          // fond marin pres des bords du crop OU hors zone mesuree du DDS:
          // fondu vers l'abysse — ni la couture du crop ni les plateaux de
          // bathymetrie INFEREE (extension nord) ne se dessinent dans l'ocean
          if (vPos.z < 0.0) {
            float dEdge = min(min(vPos.x - uTerrBounds.x, uTerrBounds.z - vPos.x),
                              min(vPos.y - uTerrBounds.y, uTerrBounds.w - vPos.y));
            float dMeas = min(min(vPos.x - uMeasBounds.x, uMeasBounds.z - vPos.x),
                              min(vPos.y - uMeasBounds.y, uMeasBounds.w - vPos.y));
            float fade = max(1.0 - smoothstep(0.0, 3000.0, dEdge),
                             1.0 - smoothstep(-200.0, 1500.0, dMeas));
            lit = mix(lit, srgb(vec3(0.03, 0.12, 0.24)), fade);
          }
          if (uContours > 0.5 && vPos.z > 0.0) {
            float lw  = fwidth(vPos.z);
            float c50 = abs(fract(vPos.z / 50.0 + 0.5) - 0.5) * 50.0;
            float c10 = abs(fract(vPos.z / 10.0 + 0.5) - 0.5) * 10.0;
            float l50 = 1.0 - smoothstep(0.0, max(lw * 1.6, 0.35), c50);
            float l10 = 1.0 - smoothstep(0.0, max(lw * 1.2, 0.25), c10);
            lit = mix(lit, lit * 0.55, min(1.0, l50 * 0.85 + l10 * 0.30));
          }
          gl_FragColor = vec4(lit, 1.0);
          #include <fog_fragment>
          #include <colorspace_fragment>
        }`});
    // [DRAPE-2D] UVs planaires pour draper la map 2D sur le relief
    {
      const W = (nx - 1) * step, H = (ny - 1) * step;
      const uv = new Float32Array(nx * ny * 2);
      for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) {
        const k = j * nx + i;
        uv[2*k] = (i * step) / W;
        uv[2*k+1] = (j * step) / H;      // v=0 au sud; flipY=false sur la texture
      }
      g.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
    }
    const terrainMesh = new THREE.Mesh(g, mat);
    layers.terrain.add(terrainMesh);
    // [DRAPE-2D] texture assemblee depuis les tiles (source = chip leak map),
    // 4 m/px; les lacs/routes/details de la carte apparaissent sur le relief.
    let drapeTex = null;
    function buildDrape() {
      const TZ2 = 3, MPX = 32 / (2 ** TZ2);          // 4 m/px
      const x1 = x0 + (nx - 1) * step, yTop = y0 + (ny - 1) * step;
      const cw = Math.min(8192, Math.round((x1 - x0) / MPX));
      const ch = Math.min(8192, Math.round((yTop - y0) / MPX));
      const can = document.createElement('canvas');
      can.width = cw; can.height = ch;
      const ctx = can.getContext('2d');
      ctx.fillStyle = '#1a4a6e'; ctx.fillRect(0, 0, cw, ch);
      drapeTex = new THREE.CanvasTexture(can);
      drapeTex.colorSpace = THREE.SRGBColorSpace;
      // canvas dessine nord-en-haut (rangee 0 = nord); UVs v=0 au sud ->
      // flipY=TRUE pour que v=1 lise la rangee 0. (flipY=false = map en
      // miroir N-S — "le drap est completement brise", Alexandre avait raison)
      drapeTex.flipY = true;
      drapeTex.anisotropy = 4;                       // 16 = trop cher sur petites machines
      // [BEAUTY-V1] plus de second materiau: la texture entre dans le shader
      // terrain par uniform (uUseDrape bascule sans recompilation — la lecon
      // [DRAPE-MAT] reglee par construction).
      terraUni.uDrape.value = drapeTex;
      let s0 = localStorage.getItem('ui.tileSrc') || 'leak,1';
      if (s0 === 'yanis') s0 = 'yanis,14'; if (s0 === 'leak') s0 = 'leak,1';
      const srcQ = s0 !== 'yanis,14' ? `&src=${encodeURIComponent(s0)}&v=${encodeURIComponent(s0 + '.4')}` : '';
      const t0x = Math.floor((16384 + x0) / MPX / 256), t1x = Math.floor((16384 + x1) / MPX / 256);
      const t0y = Math.floor((16384 - yTop) / MPX / 256), t1y = Math.floor((16384 - y0) / MPX / 256);
      for (let ty = t0y; ty <= t1y; ty++) for (let tx = t0x; tx <= t1x; tx++) {
        const img = new Image();
        img.onload = () => {
          // canvas standard nord-en-haut: rangee = (yTop - y) / MPX
          const wx = tx * 256 * MPX - 16384, wyTop2 = 16384 - ty * 256 * MPX;
          const cx = (wx - x0) / MPX;
          const cy = (yTop - wyTop2) / MPX;
          ctx.drawImage(img, cx, cy);
          drapeTex.needsUpdate = true;
        };
        img.src = `/tiles/${TZ2}/${TZ2},${ty},${tx}.jpg?v=14${srcQ}`;
      }
    }
    // [BEAUTY-V1] ocean vivant a z=0: vagues procedurales animees, fresnel
    // qui reflete le ciel, glint speculaire du soleil. Le plan deborde
    // largement du terrain -> l'eau court jusqu'a l'horizon (la brume fait
    // la couture avec le dome de ciel). Translucide: les fonds marins du
    // shader terrain donnent le degrade turquoise->abysse pres des cotes.
    const seaG = new THREE.PlaneGeometry(160000, 160000);
    seaG.translate(x0 + (nx-1)*step/2, y0 + (ny-1)*step/2, 0);
    seaUni.uTerrBounds.value.set(x0, y0, x0 + (nx-1)*step, y0 + (ny-1)*step);
    terraUni.uTerrBounds.value.copy(seaUni.uTerrBounds.value);
    const sea = new THREE.Mesh(seaG, new THREE.ShaderMaterial({
      transparent: true, depthWrite: false, fog: true, side: THREE.DoubleSide,
      uniforms: seaUni,
      vertexShader: `
        varying vec3 vPos;
        #include <common>
        #include <logdepthbuf_pars_vertex>
        #include <fog_pars_vertex>
        void main() {
          vPos = position;
          vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
          gl_Position = projectionMatrix * mvPosition;
          #include <logdepthbuf_vertex>
          #include <fog_vertex>
        }`,
      fragmentShader: `
        varying vec3 vPos;
        uniform vec3 uSunDir, uHorizon, uZenith, uSunColor;
        uniform float uTime;
        uniform vec4 uTerrBounds;
        #include <common>
        #include <logdepthbuf_pars_fragment>
        #include <fog_pars_fragment>
        vec3 srgb(vec3 c) { return pow(c, vec3(2.2)); }
        void main() {
          #include <logdepthbuf_fragment>
          vec2 p = vPos.xy; float t = uTime;
          float dist = length(cameraPosition - vPos);
          // les vagues s'eteignent avec la distance: sans ca, les sinus
          // sous-pixel produisent un moire en grille sur tout l'ocean
          float att = 1.0 / (1.0 + dist * 0.002 + dist * dist * 3.5e-7);
          vec2 gwave = vec2(0.0);
          gwave += vec2(sin(p.x * 0.030 + t * 0.9) * 0.030, sin(p.y * 0.041 + t * 0.7) * 0.041);
          gwave += vec2(cos((p.x + p.y) * 0.019 + t * 1.25)) * 0.019 * 0.7;
          gwave += vec2(sin(p.x * 0.110 - t * 1.8) * 0.110, sin(p.y * 0.089 + t * 2.1) * 0.089) * 0.22 * att;
          vec3 n = normalize(vec3(-gwave * 8.0 * att, 1.0));
          vec3 V = normalize(cameraPosition - vPos);
          float fres = pow(1.0 - max(dot(n, V), 0.0), 3.0);
          vec3 skyRefl = mix(uZenith, uHorizon, 0.65);
          vec3 deep = srgb(vec3(0.05, 0.19, 0.28));
          vec3 col = mix(deep, skyRefl, 0.22 + 0.58 * fres);
          vec3 H = normalize(V + uSunDir);
          float spec = pow(max(dot(n, H), 0.0), 340.0) * 2.0
                     + pow(max(dot(n, H), 0.0), 60.0) * 0.22;
          col += uSunColor * spec * (0.25 + 0.75 * att);
          // hors du crop terrain il n'y a pas de fond marin sous l'eau: on
          // opacifie et on fond vers l'abysse (fondu 2 km) — sinon le
          // rectangle du crop se dessine dans l'ocean
          float dEdge = min(min(vPos.x - uTerrBounds.x, uTerrBounds.z - vPos.x),
                            min(vPos.y - uTerrBounds.y, uTerrBounds.w - vPos.y));
          float outside = 1.0 - smoothstep(0.0, 2000.0, dEdge);
          // unification par la DISTANCE: au loin l'eau devient opaque partout
          // (memes constantes dedans/dehors -> la couture du crop est
          // invisible sous tout angle); la translucidite ne vit que pres des
          // cotes, la ou les hauts-fonds la meritent
          float farBlend = max(outside, smoothstep(3000.0, 10000.0, dist));
          col = mix(col, mix(deep * 0.62, skyRefl, 0.26 + 0.56 * fres), farBlend);
          gl_FragColor = vec4(col, mix(0.62 + 0.30 * fres, 1.0, farBlend));
          #include <fog_fragment>
          #include <colorspace_fragment>
        }`}));
    sea.renderOrder = 2;                 // toujours apres le relief
    sea.name = 'terrain-sea';
    sea.frustumCulled = false;
    layers.terrain.add(sea);
    // [DRAPE-CHIP] APRES la creation de la mer (setDrape la reference — la
    // placer avant = TDZ "Cannot access 'sea'" et tout le bloc terrain meurt)
    {
      const chip = document.getElementById('ly-drape');
      const setDrape = on => {
        if (on && !drapeTex) buildDrape();
        terraUni.uUseDrape.value = on ? 1 : 0;   // uniform: zero recompilation
        // [BEAUTY-V1] la mer 3D reste visible en drape: l'eau plate de la map
        // sous la surface animee (le voile bleu d'antan venait d'une
        // recompilation qui cassait le depth write — resolu par construction)
      };
      // [DRAPE-DEFAULT] actif par defaut (l'eau, les routes, les details de
      // la map 2D) — opt-out persistant via le chip.
      if (localStorage.getItem('ui.drape3d') !== '0') { chip.classList.add('on'); setDrape(true); }
      chip.addEventListener('click', () => {
        const on = chip.classList.toggle('on');
        localStorage.setItem('ui.drape3d', on ? '1' : '0');
        setDrape(on);
      });
      // [DRAPE-REBUILD] quand la source de tiles change (chip leak map)
      window.__rebuildDrape = () => {
        if (drapeTex) drapeTex.dispose();
        drapeTex = null;
        if (chip.classList.contains('on')) setDrape(true);
      };
    }
    // [BEAUTY-V1] courbes de niveau (chip HUD)
    {
      const chip = document.getElementById('ly-contours');
      chip.addEventListener('click', () => {
        terraUni.uContours.value = chip.classList.toggle('on') ? 1 : 0;
      });
    }
    window.__terrain = { mesh: layers.terrain.children[0], sea, layers, THREE, camera, controls };  // debug hook
    // [COORDREAD-3D] grille exposee pour le readout curseur (voir plus bas)
    window.__hgrid = { Z, nx, ny, x0, y0, step };
    layers.ground.visible = false;       // le relief remplace le sol plat au chargement
    // [BEAUTY-V1] plus de lumieres three: l'eclairage vit dans les shaders
    // (soleil reglable via le panneau Environnement)
    console.log('[HEIGHTMAP-V1] terrain', nx, 'x', ny, '@', step, 'm');
  } catch (e) {
    console.warn('terrain3d:', e);
    // [TERRAIN-ERR] echec visible: bandeau rouge au lieu d'un silence
    const b = document.createElement('div');
    b.style.cssText = 'position:fixed;left:50%;top:14px;transform:translateX(-50%);' +
      'z-index:60;background:#7f1d1d;color:#fecaca;border:1px solid #b91c1c;' +
      'border-radius:8px;padding:6px 14px;font:12px ui-monospace,monospace';
    b.textContent = 'terrain: echec de chargement (' + (e && e.message || e) + ') — recharger (Cmd+Shift+R)';
    document.body.appendChild(b);
  }
})();

// ── frustums: un LineSegments par tier (perf: 174 cams en 5 draws) ──
const byTier = {};
for (const c of data.cameras) {
  const t = c.tier || 'unverified';
  (byTier[t] = byTier[t] || []).push(c);
}
const camPickPositions = [];   // pour le raycast hover
const camPickRefs = [];
for (const [tier, cams] of Object.entries(byTier)) {
  const verts = [];
  for (const c of cams) {
    const [x, y, z] = c.xyz;
    camPickPositions.push(x, y, z);
    camPickRefs.push(c);
    if (!c.corners) continue;
    const tips = c.corners.map(d => [x + d[0] * FRUSTUM_LEN,
                                     y + d[1] * FRUSTUM_LEN,
                                     z + d[2] * FRUSTUM_LEN]);
    for (const tip of tips) verts.push(x, y, z, ...tip);          // 4 aretes apex→coin
    for (let i = 0; i < 4; i++)                                    // rectangle du fond
      verts.push(...tips[i], ...tips[(i + 1) % 4]);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
  const m = new THREE.LineBasicMaterial({ color: TIER_COLORS[tier],
    transparent: true, opacity: tier === 'unverified' ? 0.22 : 0.65 });
  layers.cams.add(new THREE.LineSegments(g, m));
}

// ── [POSE-COPY] pose camera live (bas-gauche): vole jusqu'a repliquer une
// vue, clique le badge -> JSON {"xyz","ypr"} dans le presse-papier, colle-le
// dans le chat et la resection part de la. yaw/pitch dans la convention
// cameras.json (yaw anti-horaire depuis +y, pitch + = vers le haut).
(() => {
  const el = document.createElement('div');
  el.style.cssText = 'position:fixed;left:10px;bottom:34px;z-index:30;' +
    'background:rgba(10,10,13,.72);border:1px solid #2c2c33;border-radius:8px;' +
    'padding:5px 11px;font:11px ui-monospace,monospace;color:#facc15;' +
    'cursor:pointer;white-space:nowrap;user-select:none';
  el.title = 'clic: copier la pose (JSON) pour la donner a Claude';
  document.body.appendChild(el);
  const dirV = new THREE.Vector3();
  function pose() {
    camera.getWorldDirection(dirV);
    const yaw = ((-Math.atan2(dirV.x, dirV.y) * 180 / Math.PI) % 360 + 360) % 360;
    const pitch = Math.asin(Math.max(-1, Math.min(1, dirV.z))) * 180 / Math.PI;
    return { xyz: [ +camera.position.x.toFixed(1), +camera.position.y.toFixed(1),
                    +camera.position.z.toFixed(1) ],
             ypr: [ +yaw.toFixed(2), +pitch.toFixed(2), 0 ] };
  }
  setInterval(() => {
    const p = pose();
    el.textContent = `CAM ${p.xyz.join(', ')}  yaw ${p.ypr[0]}  pitch ${p.ypr[1]}  (clic = copier)`;
  }, 250);
  el.addEventListener('click', () => {
    const txt = JSON.stringify(pose());
    (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject())
      .then(() => { el.style.color = '#4ade80'; setTimeout(() => el.style.color = '#facc15', 700); })
      .catch(() => { prompt('copie manuelle:', txt); });
  });
})();

// ── [COORDREAD-3D] X/Y/Z monde sous le curseur (meme readout que la Map) ──
// Raymarch curseur->grille de hauteur (25 m puis bisection): pas de raycast
// sur les 245k triangles du mesh, ~1200 lookups max par mouvement.
(() => {
  const el = document.createElement('div');
  el.style.cssText = 'position:fixed;right:10px;bottom:10px;z-index:30;' +
    'background:rgba(10,10,13,.72);border:1px solid #2c2c33;border-radius:8px;' +
    'padding:5px 11px;font:11px ui-monospace,monospace;color:#4ade80;' +
    'pointer-events:none;white-space:nowrap;opacity:0;transition:opacity .12s';
  el.textContent = 'X —  Y —  Z —';
  document.body.appendChild(el);
  function gz(x, y) {
    const g = window.__hgrid;
    if (!g) return null;
    const fi = (x - g.x0) / g.step, fj = (y - g.y0) / g.step;
    if (fi < 0 || fj < 0 || fi >= g.nx - 1 || fj >= g.ny - 1) return null;
    const i = Math.floor(fi), j = Math.floor(fj), u = fi - i, v = fj - j;
    const k = j * g.nx + i;
    return g.Z[k]*(1-u)*(1-v) + g.Z[k+1]*u*(1-v) + g.Z[k+g.nx]*(1-u)*v + g.Z[k+g.nx+1]*u*v;
  }
  const rc = new THREE.Raycaster();
  let last = 0;
  renderer.domElement.addEventListener('pointermove', ev => {
    const now = performance.now();
    if (now - last < 50) return;         // throttle 20 Hz
    last = now;
    if (!window.__hgrid) return;
    const r = renderer.domElement.getBoundingClientRect();
    rc.setFromCamera({ x: (ev.clientX - r.left) / r.width * 2 - 1,
                       y: -((ev.clientY - r.top) / r.height) * 2 + 1 }, camera);
    const o = rc.ray.origin, d = rc.ray.direction;
    let t0 = 0, hit = null;
    let f0 = o.z - (gz(o.x, o.y) ?? -301);
    for (let t = 25; t < 30000; t += 25) {
      const x = o.x + d.x*t, y = o.y + d.y*t, z = o.z + d.z*t;
      const g = gz(x, y);
      const f = z - (g ?? -301);
      if (f0 > 0 && f <= 0) {            // traversee: bisection
        let a = t0, b = t;
        for (let k = 0; k < 14; k++) {
          const m = (a + b) / 2;
          const gm = gz(o.x + d.x*m, o.y + d.y*m) ?? -301;
          ((o.z + d.z*m) - gm > 0) ? a = m : b = m;
        }
        hit = (a + b) / 2;
        break;
      }
      f0 = f; t0 = t;
    }
    if (hit === null) { el.style.opacity = 0; return; }
    const hx = o.x + d.x*hit, hy = o.y + d.y*hit;
    const g = gz(hx, hy);
    el.textContent = `X ${hx.toFixed(1)}   Y ${hy.toFixed(1)}   Z ${(g === null || g < -300.5) ? '—' : g.toFixed(1)}`;
    el.style.opacity = 1;
  });
  renderer.domElement.addEventListener('pointerleave', () => { el.style.opacity = 0; });
})();

// ── [VIEW3D-POV] entrer dans la vue exacte d'une cam ──
// Base camera derivee des 4 coins de frustum serveur (TL,TR,BR,BL) — les
// symetries du pinhole rendent ces formules EXACTES: TR-TL ∝ axe droit,
// BL->TL ∝ axe up, somme des 4 ∝ direction; zero convention ypr en JS.
const povFrame = document.getElementById('pov-frame');   // (V4: plus utilise pour le rendu, conserve pour compat)
let povQuad = null;
scene.add(camera);   // [POV-V4] requis pour que les enfants de la camera rendent
function killQuad() {
  if (!povQuad) return;
  camera.remove(povQuad);
  povQuad.geometry.dispose();
  if (povQuad.material.map) povQuad.material.map.dispose();
  povQuad.material.dispose();
  povQuad = null;
}
const povPanel = document.getElementById('pov');
const povAlpha = document.getElementById('pov-alpha');
let povPrev = null;

// ── [POV-ZOOM-V1] reculer SANS quitter la cam ──
// Alexandre: "zoom out sans qu'on sorte de la cam, mais que l'image rapetisse
// pour voir plus de map". Reculer physiquement la camera changerait la
// parallaxe et desalignerait la frame du monde: la seule transformation qui
// preserve l'alignement depuis un point de vue fixe est d'ELARGIR le champ.
// On pose tan(F/2) = zoom * tan(vfov0/2), et la frame occupe alors exactement
// 1/zoom de la hauteur d'ecran — exact, pas approche.
let povBase = null;          // {vfov0, ratio, marks}
let povZoom = 1;
const povZoomEl = document.getElementById('pov-zoom');
const povZoomV = document.getElementById('pov-zoomv');

function povMaxZoom() {
  // on borne le ZOOM, pas le fov: un fov ecrete casserait la relation
  // ci-dessus et l'image glisserait sans que rien ne le signale.
  const v0 = THREE.MathUtils.degToRad(povBase.vfov0);
  return Math.min(6, Math.tan(THREE.MathUtils.degToRad(82.5)) / Math.tan(v0 / 2));
}
function renderPovMarks() {
  const div = document.getElementById('pov-marks');
  if (!povPrev || !povBase || !povBase.marks) return;
  const d = povBase.marks;
  div.innerHTML = '';
  const [W, H] = realSize();
  const ih = H / povZoom, iw = ih * povBase.ratio;
  const ileft = (W - iw) / 2, itop = (H - ih) / 2;   // centree en X ET en Y
  const W2 = d.size || [3840, 2160];
  for (const m of d.markings || []) {
    const fx = ileft + m.px[0] * (iw / W2[0]);
    const fy = itop + m.px[1] * (ih / W2[1]);
    const v = new THREE.Vector3(...m.xyz).project(camera);
    const wx = (v.x + 1) / 2 * W, wy = (1 - v.y) / 2 * H;
    const mk = (x, y, color, sym) => {
      const el = document.createElement('div');
      el.textContent = sym;
      el.style.cssText = 'position:absolute;left:' + (x - 7) + 'px;top:' + (y - 10) +
        'px;color:' + color + ';font:14px monospace;text-shadow:0 0 3px #000';
      div.appendChild(el);
    };
    mk(fx, fy, '#facc15', '+');
    if (v.z < 1) mk(wx, wy, '#67e8f9', 'x');
  }
}
function setPovZoom(z) {
  if (!povBase) return;
  povZoom = Math.max(1, Math.min(povMaxZoom(), z));
  const v0 = THREE.MathUtils.degToRad(povBase.vfov0);
  camera.fov = THREE.MathUtils.radToDeg(2 * Math.atan(povZoom * Math.tan(v0 / 2)));
  camera.updateProjectionMatrix();
  const h = (100 / povZoom).toFixed(4);
  povFrame.style.height = h + 'vh';
  povFrame.style.width = 'calc(' + h + 'vh * ' + povBase.ratio.toFixed(4) + ')';
  povZoomV.textContent = 'x' + povZoom.toFixed(1);
  if (document.activeElement !== povZoomEl) povZoomEl.value = Math.round(povZoom * 100);
  renderPovMarks();
  updatePovDbg();
}
povZoomEl.addEventListener('input', () => setPovZoom(+povZoomEl.value / 100));
addEventListener('wheel', ev => {
  if (!povPrev || !povBase) return;   // hors POV, la molette reste a OrbitControls
  ev.preventDefault();
  setPovZoom(povZoom * Math.exp(ev.deltaY * 0.0012));
}, { passive: false });
function enterPOV(c) {
  if (!c.corners) return;
  flyAnim = null;                                 // [VIEW3D-SYNC-V2] stop tout vol en cours
  const [tl, tr, br, bl] = c.corners.map(d => new THREE.Vector3(...d));
  const right = new THREE.Vector3().subVectors(tr, tl).normalize();
  const up = new THREE.Vector3().subVectors(tl, bl).normalize();
  const dir = new THREE.Vector3().add(tl).add(tr).add(br).add(bl).normalize();
  const zAxis = new THREE.Vector3().crossVectors(right, up).normalize(); // = -dir
  const yAxis = new THREE.Vector3().crossVectors(zAxis, right).normalize();
  const midTop = new THREE.Vector3().addVectors(tl, tr).normalize();
  const midBot = new THREE.Vector3().addVectors(bl, br).normalize();
  const vfov = THREE.MathUtils.radToDeg(midTop.angleTo(midBot));
  const midL = new THREE.Vector3().addVectors(tl, bl).normalize();
  const midR = new THREE.Vector3().addVectors(tr, br).normalize();
  const hfov = midL.angleTo(midR);
  if (!povPrev) povPrev = { pos: camera.position.clone(), quat: camera.quaternion.clone(),
                            fov: camera.fov, near: camera.near, target: controls.target.clone() };
  camera.position.set(...c.xyz);
  const m = new THREE.Matrix4().makeBasis(right, yAxis, zAxis);
  camera.quaternion.setFromRotationMatrix(m);
  camera.fov = vfov; camera.near = 0.5;
  camera.updateProjectionMatrix();
  camera.updateMatrixWorld(true);
  // [POV-TERRAIN-V2] le terrain RESTE visible en POV (c'est le check de pose:
  // silhouettes du relief vs frame); il suit simplement l'etat du chip.
  window.__povState = { pos: camera.position.toArray(),
                        lookDir: camera.getWorldDirection(new THREE.Vector3()).toArray(),
                        wantDir: dir.toArray(), fov: camera.fov };
  // [POV-V9] LA SIMPLICITE: la frame est une IMAGE HTML par-dessus le canvas.
  // Zero texture GPU, zero quad, zero dependance machine — du CSS deterministe.
  // Alignement: la camera POV a exactement le vfov de la frame -> la frame a
  // hauteur 100vh est angulairement exacte; largeur = 100vh x (aspect frame),
  // centree. Prouve pixel-perfect a l'ere V3 (0.1-2.3px sur 3 cams).
  killQuad();
  const ratio = Math.tan(hfov / 2) / Math.tan(THREE.MathUtils.degToRad(vfov) / 2);
  povBase = { vfov0: vfov, ratio: ratio, marks: null, vfovOrig: vfov };
  // [POSE-EDIT] slider fov: 100 = fov stocke; la frame reste plein cadre,
  // seul le relief derriere change — l'oeil juge quand ils collent.
  {
    // [POSE-EDIT-STICKY] les reglages survivent aux re-entrees de POV (sync
    // calib, re-clic...) — c'etait le bug "les curseurs reviennent a zero
    // des que je relache": quelque chose re-entrait dans le POV et on
    // reinitialisait tout. Memorise par cam.
    window.__povAdj = window.__povAdj || {};
    const adj = window.__povAdj[c.name] = window.__povAdj[c.name] || { f: 100, dyaw: 0, dpitch: 0 };
    const s = document.getElementById('pov-fov');
    const sv = document.getElementById('pov-fov-v');
    s.value = adj.f;
    const upd = () => {
      adj.f = parseFloat(s.value);
      povBase.vfov0 = povBase.vfovOrig * (adj.f / 100);
      const hf = 2 * Math.atan(Math.tan(THREE.MathUtils.degToRad(povBase.vfov0) / 2) * povBase.ratio);
      sv.textContent = 'hfov ' + THREE.MathUtils.radToDeg(hf).toFixed(1) + '°';
      setPovZoom(povZoom);
    };
    s.oninput = upd;
    upd();
    // [POSE-EDIT] slider yaw: tourne le monde derriere la frame (fixe).
    const baseQuat = camera.quaternion.clone();
    const sy = document.getElementById('pov-yaw');
    const syv = document.getElementById('pov-yaw-v');
    const sp = document.getElementById('pov-pitch');
    const spv = document.getElementById('pov-pitch-v');
    sy.value = adj.dyaw * 100; sp.value = adj.dpitch * 100;
    let dyaw = adj.dyaw, dpitch = adj.dpitch;
    const applyOrient = () => {
      // yaw = rotation monde autour de Z; pitch = rotation locale autour de
      // l'axe droit de la camera (pitch + = lever le nez)
      const qz = new THREE.Quaternion().setFromAxisAngle(
        new THREE.Vector3(0, 0, 1), THREE.MathUtils.degToRad(dyaw));
      const qx = new THREE.Quaternion().setFromAxisAngle(
        new THREE.Vector3(1, 0, 0), THREE.MathUtils.degToRad(dpitch));
      camera.quaternion.copy(qz).multiply(baseQuat).multiply(qx);
      camera.updateMatrixWorld(true);
      syv.textContent = (dyaw >= 0 ? '+' : '') + dyaw.toFixed(2) + '°';
      spv.textContent = (dpitch >= 0 ? '+' : '') + dpitch.toFixed(2) + '°';
      adj.dyaw = dyaw; adj.dpitch = dpitch;
      renderPovMarks();
    };
    sy.oninput = () => { dyaw = parseFloat(sy.value) / 100; applyOrient(); };
    sp.oninput = () => { dpitch = parseFloat(sp.value) / 100; applyOrient(); };
    applyOrient();
    document.getElementById('pov-fov-save').onclick = async () => {
      const hf = THREE.MathUtils.radToDeg(2 * Math.atan(
        Math.tan(THREE.MathUtils.degToRad(povBase.vfov0) / 2) * povBase.ratio));
      const name = document.getElementById('pov-name').textContent;
      let url = `/api/set_cam_pose?cam=${encodeURIComponent(name)}&hfov=${hf.toFixed(3)}`;
      if (dyaw !== 0 && c.ypr) {
        url += `&yaw=${(c.ypr[0] + dyaw).toFixed(3)}`;
      }
      if (dpitch !== 0 && c.ypr) {
        url += `&pitch=${(c.ypr[1] + dpitch).toFixed(3)}`;
      }
      let r = await fetch(url).then(x => x.json()).catch(() => ({error: 'reseau'}));
      if (r.error === 'SOLVED') {
        if (confirm(name + ' est SOLVED (validee). Ecraser fov/yaw quand meme?')) {
          r = await fetch(url + '&override=1').then(x => x.json()).catch(() => ({error: 'reseau'}));
        } else return;
      }
      sv.textContent = r.ok
        ? ('sauve: hfov ' + hf.toFixed(1) + '°' + (dyaw !== 0 ? ', yaw ' + (c.ypr[0] + dyaw).toFixed(2) + '°' : ''))
        : ('echec: ' + (r.error || '?'));
    };
  }
  povZoom = 1;
  setPovZoom(1);                       // pose fov, taille de la frame et l'affichage
  povFrame.style.outline = '1px solid rgba(250,204,21,.35)';
  povFrame.style.opacity = povAlpha.value / 100;
  povFrame.style.display = 'block';
  povFrame.onerror = () => { povFrame.style.display = 'none'; };
  povFrame.src = '/frame/' + encodeURIComponent(c.name);
  // [POV-MARKS] auto-preuve d'alignement: croix JAUNES = markings a leur
  // position dans la frame (via la geometrie CSS de l'img), croix CYAN =
  // meme landmarks projetes par la camera 3D. Superposees = aligne.
  const marksDiv = document.getElementById('pov-marks');
  marksDiv.style.display = 'block';
  marksDiv.innerHTML = '';
  fetch('/api/cam_markings?cam=' + encodeURIComponent(c.name))
    .then(r => r.json()).then(d => {
      if (!povPrev || !povBase) return;   // sorti du POV entre-temps
      povBase.marks = d;                  // gardees: a redessiner a chaque cran de zoom
      renderPovMarks();
    }).catch(() => {});
  updatePovDbg();
  controls.enabled = false;
  povPanel.style.display = 'flex';
  document.getElementById('pov-name').textContent = c.name;
  // overlay de la frame reelle: vfov epouse la hauteur ecran par construction
  // -> height 100vh + largeur au ratio angulaire = alignement pixel-a-pixel
}
function exitPOV() {
  if (!povPrev) return;
  camera.position.copy(povPrev.pos);
  camera.quaternion.copy(povPrev.quat);
  camera.fov = povPrev.fov; camera.near = povPrev.near;
  camera.updateProjectionMatrix();
  controls.target.copy(povPrev.target);
  controls.enabled = true;
  povPrev = null;
  povBase = null; povZoom = 1;
  povZoomEl.value = 100; povZoomV.textContent = 'x1.0';
  povPanel.style.display = 'none';
  killQuad();
  povFrame.style.display = 'none';
  povFrame.src = '';
  const md2 = document.getElementById('pov-marks');
  md2.style.display = 'none'; md2.innerHTML = '';
}
povAlpha.addEventListener('input', () => { povFrame.style.opacity = povAlpha.value / 100; });
document.getElementById('pov-exit').addEventListener('click', exitPOV);
addEventListener('keydown', ev => { if (ev.key === 'Escape') exitPOV(); });
// en iframe, le focus clavier vit chez le parent — on ecoute aussi la-bas
try {
  if (window.parent !== window) {
    window.parent.addEventListener('keydown', ev => { if (ev.key === 'Escape') exitPOV(); });
  }
} catch (e) {}
// hook de test/debug + usage programmatique
window.__enterPOV = name => {
  const c = camPickRefs.find(c => c.name === name);
  if (c) enterPOV(c);
  return !!c;
};

// ── [VIEW3D-SYNC] focus d'une cam (message du parent): marqueur + vol ──
let focusMarker = null, activeCamRef = null, flyAnim = null;
function focusCam(name) {
  const c = camPickRefs.find(c => c.name === name);
  if (!c) return false;
  activeCamRef = c;
  if (povPrev) exitPOV();
  if (!focusMarker) {
    const g = new THREE.SphereGeometry(9, 12, 8);
    focusMarker = new THREE.Mesh(g, new THREE.MeshBasicMaterial({
      color: 0xfacc15, transparent: true, opacity: 0.9 }));
    scene.add(focusMarker);
  }
  focusMarker.position.set(...c.xyz);
  focusMarker.visible = true;
  // vol: on se place derriere la cam par rapport a sa direction de visee
  let back = new THREE.Vector3(0, 0, 0);
  if (c.corners) {
    for (const d of c.corners) back.add(new THREE.Vector3(...d));
    back.normalize().multiplyScalar(-420);
  } else back.set(300, -300, 0);
  const dst = new THREE.Vector3(...c.xyz).add(back).add(new THREE.Vector3(0, 0, 160));
  const p0 = camera.position.clone(), t0 = controls.target.clone();
  const tgt = new THREE.Vector3(...c.xyz);
  const start = performance.now();
  flyAnim = () => {
    const k = Math.min(1, (performance.now() - start) / 700);
    const e = k * k * (3 - 2 * k);            // smoothstep
    camera.position.lerpVectors(p0, dst, e);
    controls.target.lerpVectors(t0, tgt, e);
    if (k >= 1) flyAnim = null;
  };
  return true;
}
// [VIEW3D-SYNC-V2] selection d'une cam depuis calib = entrer DIRECTEMENT
// dans sa vue exacte (POV + frame en opacite reglable, la demande
// d'Alexandre). Esc sort vers une vue libre placee derriere la cam (on voit
// ou elle vit dans l'espace), et de la on dezoome librement sur la map.
function syncToCam(name) {
  const c = camPickRefs.find(c => c.name === name);
  if (!c) return false;
  if (!c.corners) return focusCam(name);         // pas de frustum -> survol
  activeCamRef = c;
  if (!focusMarker) {
    focusMarker = new THREE.Mesh(new THREE.SphereGeometry(9, 12, 8),
      new THREE.MeshBasicMaterial({ color: 0xfacc15, transparent: true, opacity: 0.9 }));
    scene.add(focusMarker);
  }
  focusMarker.position.set(...c.xyz);
  focusMarker.visible = true;
  flyAnim = null;                                 // un vol en cours ne doit pas tirer sur le POV
  if (povPrev) exitPOV();
  enterPOV(c);
  // la sortie du POV atterrit derriere la cam, pas a la vue d'avant
  const back = new THREE.Vector3(0, 0, 0);
  for (const d of c.corners) back.add(new THREE.Vector3(...d));
  back.normalize().multiplyScalar(-420);
  const dst = new THREE.Vector3(...c.xyz).add(back).add(new THREE.Vector3(0, 0, 160));
  povPrev = { pos: dst, quat: camera.quaternion.clone(), fov: 55, near: 1,
              target: new THREE.Vector3(...c.xyz) };
  return true;
}
window.__focusCam = focusCam;
window.__syncToCam = syncToCam;
sceneReady = true;                               // [VIEW3D-SYNC]
if (pendingFocus) { syncToCam(pendingFocus); pendingFocus = null; }

// ── [VIEW3D-SHOT] export PNG: vue 3D + frame de la cam active en medaillon ──
document.getElementById('btn-shot').addEventListener('click', async () => {
  renderer.render(scene, camera);
  const w = renderer.domElement.width, h = renderer.domElement.height;
  const out = document.createElement('canvas');
  out.width = w; out.height = h;
  const octx = out.getContext('2d');
  octx.drawImage(renderer.domElement, 0, 0);
  const cRef = (povPrev && povPanel.style.display !== 'none')
    ? camPickRefs.find(c => c.name === document.getElementById('pov-name').textContent)
    : activeCamRef;
  if (cRef) {
    try {
      const img = new Image();
      await new Promise((res, rej) => {
        img.onload = res; img.onerror = rej;
        img.src = '/frame/' + encodeURIComponent(cRef.name);
      });
      const mw = Math.round(w * 0.24), mh = Math.round(mw * img.naturalHeight / img.naturalWidth);
      octx.fillStyle = '#0a0a0c';
      octx.fillRect(w - mw - 18, h - mh - 18, mw + 8, mh + 8);
      octx.drawImage(img, w - mw - 14, h - mh - 14, mw, mh);
      octx.strokeStyle = '#facc15'; octx.lineWidth = 2;
      octx.strokeRect(w - mw - 14, h - mh - 14, mw, mh);
      octx.fillStyle = '#e2e2f0'; octx.font = '13px monospace';
      octx.fillText(cRef.name, w - mw - 14, h - mh - 22);
    } catch (e) {}
  }
  const a = document.createElement('a');
  a.download = 'gtamaplib-3d' + (cRef ? '-' + cRef.name.replace(/[^\w]+/g, '_') : '') + '.png';
  a.href = out.toDataURL('image/png');
  a.click();
});

// ── hover ──
const ray = new THREE.Raycaster();
ray.params.Points.threshold = 30;
const info = document.getElementById('info');
// [VIEW3D-OPEN] clic (pas drag) sur une cam -> ouvre la cam dans l'onglet
// Camera du parent (iframe). On distingue clic et drag par le deplacement.
let downAt = null;
addEventListener('pointerdown', ev => { downAt = [ev.clientX, ev.clientY]; });
addEventListener('pointerup', ev => {
  if (!downAt) return;
  const moved = Math.hypot(ev.clientX - downAt[0], ev.clientY - downAt[1]);
  downAt = null;
  if (moved > 5) return;
  const ndc = new THREE.Vector2(ev.clientX / innerWidth * 2 - 1,
                                -(ev.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hits = ray.intersectObject(pickPts);
  if (!hits.length) return;
  const c = camPickRefs[hits[0].index];
  // [POV-HOP] clic sur un frustum = on saute dans la vue de cette cam
  // (shift-clic identique — conserve par habitude), et la selection de cam
  // suit dans calib sans changer d'onglet.
  syncToCam(c.name);
  if (window.self !== window.top) {
    window.parent.postMessage({ type: 'gtamaplib-select-cam', name: c.name }, '*');
  }
});

addEventListener('pointermove', ev => {
  const ndc = new THREE.Vector2(ev.clientX / innerWidth * 2 - 1,
                                -(ev.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hits = ray.intersectObject(pickPts);
  if (hits.length) {
    const c = camPickRefs[hits[0].index];
    showHoverRays(c);                              // [VIEW3D-RAYS]
    const rms = c.rms_arcmin;
    info.style.display = 'block';
    info.innerHTML = `<b>${c.name}</b><br>` +
      `tier ${c.tier || 'unverified'} · ${c.n_pixels} markings` +
      (c.hud_locked ? ' · HUD-locked' : '') +
      (rms != null ? `<br>RMS <span class="${rms > 10 ? 'rms-bad' : ''}">${rms}&#8242;</span>` : '') +
      (c.pose_verified ? `<br><span style="color:#4ade80">&#10003; ${c.pose_verified.split(' — ')[0]}</span>` : '') +
      (c.corners ? `<br><span style="color:var(--dim)">click: jump POV</span>` : '');
  } else {
    info.style.display = 'none';
    clearHoverRays();                              // [VIEW3D-RAYS]
  }
});

addEventListener('dblclick', ev => {
  const ndc = new THREE.Vector2(ev.clientX / innerWidth * 2 - 1,
                                -(ev.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObject(ground);
  if (hit.length) { controls.target.copy(hit[0].point); }
});

// helper de test/debug: rend une frame MAINTENANT et echantillonne des pixels
window.__renderAndSample = (pts) => {
  renderer.render(scene, camera);
  const cv = renderer.domElement;
  const out = document.createElement('canvas');
  out.width = cv.width; out.height = cv.height;
  const ctx2 = out.getContext('2d');
  ctx2.drawImage(cv, 0, 0);
  const pr = cv.width / innerWidth;
  return pts.map(([x, y]) => {
    const d = ctx2.getImageData(Math.round(x * pr) - 4, Math.round(y * pr) - 4, 9, 9).data;
    let r = 0, g = 0, b = 0, n = 0;
    for (let i = 0; i < d.length; i += 4) { r += d[i]; g += d[i + 1]; b += d[i + 2]; n++; }
    return [Math.round(r / n), Math.round(g / n), Math.round(b / n)];
  });
};

// helper de test/debug: etat de la scene
window.__sceneDebug = () => {
  const mg = layers.meshes.children[0];
  let bs = null;
  if (mg) {
    mg.geometry.computeBoundingSphere();
    const s = mg.geometry.boundingSphere;
    bs = { center: s.center.toArray().map(v => +v.toFixed(0)), radius: +s.radius.toFixed(0) };
  }
  let quad = null;
  if (povQuad) {
    const p = povQuad.geometry.parameters;
    quad = { qw: +p.width.toFixed(2), qh: +p.height.toFixed(2),
             angH: +(2 * Math.atan(p.width / 2 / 120) * 180 / Math.PI).toFixed(2),
             angV: +(2 * Math.atan(p.height / 2 / 120) * 180 / Math.PI).toFixed(2) };
  }
  const gl = renderer.getContext();
  const timg = povQuad && povQuad.material.map && povQuad.material.map.image;
  return { gl: gl.getParameter(gl.VERSION), maxTex: gl.getParameter(gl.MAX_TEXTURE_SIZE),
           texImage: timg ? [timg.width, timg.height] : null,
           fog: scene.fog ? { near: +scene.fog.near.toFixed(0), far: +scene.fog.far.toFixed(0) } : null,
           span: +span.toFixed(0), meshesVisible: layers.meshes.visible,
           nMeshVerts: mg ? mg.geometry.attributes.position.count : 0,
           camFar: camera.far, camNear: camera.near, camFov: +camera.fov.toFixed(2),
           camAspect: +camera.aspect.toFixed(3), win: [innerWidth, innerHeight], quad, bs };
};

// helper de test/debug: ou un pixel de FRAME (u,v de l'image) atterrit a
// l'ecran via le QUAD — a comparer avec __projectPoint du meme landmark
window.__quadPointScreen = (fx, fy, fw, fh) => {
  if (!povQuad) return null;
  const p = povQuad.geometry.parameters;
  const local = new THREE.Vector3((fx / fw - 0.5) * p.width,
                                  (0.5 - fy / fh) * p.height, 0);
  const world = povQuad.localToWorld(local);
  const v = world.project(camera);
  const [W, H] = realSize();
  return { x: (v.x + 1) / 2 * W, y: (1 - v.y) / 2 * H };
};

// helper de test/debug: projette un point monde -> pixels ecran
window.__projectPoint = (x, y, z) => {
  const v = new THREE.Vector3(x, y, z);
  v.project(camera);
  const [W, H] = realSize();
  return { x: (v.x + 1) / 2 * W, y: (1 - v.y) / 2 * H, behind: v.z > 1 };
};

// helper de test/debug: etat des rayons de hover
window.__hoverRaysCount = () => hoverRays ? hoverRays.geometry.attributes.position.count / 2 : 0;

// helper de test/debug: position ecran d'une cam par nom
window.__camScreen = name => {
  const i = camPickRefs.findIndex(c => c.name === name);
  if (i < 0) return null;
  const v = new THREE.Vector3(camPickPositions[i*3], camPickPositions[i*3+1], camPickPositions[i*3+2]);
  v.project(camera);
  return { x: (v.x + 1) / 2 * innerWidth, y: (1 - v.y) / 2 * innerHeight, behind: v.z > 1 };
};

renderer.setAnimationLoop(() => {
  sizeGuard();                                  // [POV-V4] auto-reparation de taille
  if (flyAnim) flyAnim();                       // [VIEW3D-SYNC] vol vers la cam
  sky.position.copy(camera.position);           // [BEAUTY-V1] le dome suit la camera
  seaUni.uTime.value = performance.now() / 1000;   // vagues animees
  // en POV la camera est pilotee par nous: controls.update() la re-orienterait
  // vers sa cible a chaque frame (meme controls.enabled=false) -> monde noir
  if (!povPrev) controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
