<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>map_view_v2 — tile rendering test</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0a0a0f;
               font-family: ui-monospace, monospace; color: #ddd; overflow: hidden; }
  #map { display: block; width: 100vw; height: 100vh; cursor: grab; }
  #map.dragging { cursor: grabbing; }

  /* HUD */
  #hud { position: absolute; top: 10px; left: 10px; padding: 10px 14px;
         background: rgba(10, 10, 15, 0.85); border: 1px solid #2a2a3a;
         border-radius: 6px; font-size: 12px; line-height: 1.6; pointer-events: none;
         min-width: 240px; }
  #hud .label { color: #8888a0; }
  #hud .val { color: #4ade80; font-weight: 700; }

  /* Controls */
  #controls { position: absolute; top: 10px; right: 10px; display: flex; gap: 6px;
              pointer-events: auto; }
  #controls button {
    font-family: ui-monospace, monospace; font-size: 11px; font-weight: 700;
    padding: 6px 12px; background: #1a1a25; color: #ddd;
    border: 1px solid #2a2a3a; border-radius: 5px; cursor: pointer;
  }
  #controls button.active { background: #4ade80; color: #000; border-color: #4ade80; }
  #controls button:hover { color: #fff; }
  #controls button.active:hover { color: #000; }

  /* Help */
  #help { position: absolute; bottom: 10px; left: 10px; padding: 8px 12px;
          background: rgba(10, 10, 15, 0.85); border: 1px solid #2a2a3a;
          border-radius: 6px; font-size: 11px; color: #8888a0; pointer-events: none; }
  #help b { color: #ddd; }
</style>
</head>
<body>
<canvas id="map"></canvas>

<div id="hud">
  <div><span class="label">cursor world:</span> <span class="val" id="cursor">—</span></div>
  <div><span class="label">view center:</span> <span class="val" id="center">—</span></div>
  <div><span class="label">zoom:</span> <span class="val" id="zoom">—</span></div>
  <div><span class="label">m/px:</span> <span class="val" id="mpp">—</span></div>
  <div><span class="label">tiles cached:</span> <span class="val" id="cached">0</span></div>
</div>

<div id="controls">
  <button id="btn-markers" class="active">Markers</button>
  <button id="btn-reset">Reset view</button>
</div>

<div id="help">
  <b>drag</b> pan · <b>wheel</b> zoom · 3 red circles = Portofino / Hotel Victor / Dominion
</div>

<script type="module">
import { GtaTileMap, TILES_CONST } from './map_view_v2.js';

const canvas = document.getElementById('map');
const ctx = canvas.getContext('2d');

// Validation markers — known landmark world coords from our JSON.
// If tiles use the same coord system, these circles must fall on the
// actual buildings on the rendered map.
const MARKERS = [
  { name: 'Portofino Tower (NW)', x: 1743.02, y: -199.41, color: '#ff3b30' },
  { name: 'Hotel Victor (NE)',    x: 1974.32, y:  744.07, color: '#ff9500' },
  { name: 'Dominion Hotel',       x: 2057.43, y:  967.12, color: '#ffcc00' },
];

// Initial view — centered on Vice City peninsula at zoom 4.
const DEFAULT_VIEW = { centerX: 1900, centerY: 400, zoom: 4 };

const tileMap = new GtaTileMap({ tileRoot: '/tiles' });

const state = {
  view: { ...DEFAULT_VIEW, width: 0, height: 0, grayscale: false },
  showMarkers: true,
  drag: null,  // { startMouseX, startMouseY, startCenterX, startCenterY }
  cursorWorld: null,
};

function resize() {
  const dpr = window.devicePixelRatio || 1;
  const cssW = window.innerWidth;
  const cssH = window.innerHeight;
  canvas.width = Math.floor(cssW * dpr);
  canvas.height = Math.floor(cssH * dpr);
  canvas.style.width = cssW + 'px';
  canvas.style.height = cssH + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  state.view.width = cssW;
  state.view.height = cssH;
  render();
}

function render() {
  ctx.fillStyle = '#0a0a0f';
  ctx.fillRect(0, 0, state.view.width, state.view.height);

  tileMap.render(ctx, state.view);

  if (state.showMarkers) drawMarkers();

  updateHud();
}

function drawMarkers() {
  for (const m of MARKERS) {
    const pos = tileMap.worldToScreen(m.x, m.y, state.view);
    // Skip if offscreen.
    if (pos.x < -50 || pos.x > state.view.width + 50 || pos.y < -50 || pos.y > state.view.height + 50) continue;

    ctx.save();
    // Outer ring
    ctx.beginPath();
    ctx.arc(pos.x, pos.y, 10, 0, Math.PI * 2);
    ctx.strokeStyle = m.color;
    ctx.lineWidth = 3;
    ctx.stroke();
    // Inner dot
    ctx.beginPath();
    ctx.arc(pos.x, pos.y, 2.5, 0, Math.PI * 2);
    ctx.fillStyle = m.color;
    ctx.fill();
    // Label
    ctx.font = '11px ui-monospace, monospace';
    ctx.fillStyle = '#000';
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 3;
    ctx.strokeText(m.name, pos.x + 14, pos.y + 4);
    ctx.fillStyle = m.color;
    ctx.fillText(m.name, pos.x + 14, pos.y + 4);
    ctx.restore();
  }
}

function updateHud() {
  document.getElementById('center').textContent =
    `(${state.view.centerX.toFixed(1)}, ${state.view.centerY.toFixed(1)})`;
  document.getElementById('zoom').textContent = state.view.zoom.toFixed(2);
  document.getElementById('mpp').textContent = tileMap.metersPerPixel(state.view.zoom).toFixed(3) + ' m/px';
  document.getElementById('cached').textContent = tileMap.cache.size;
  if (state.cursorWorld) {
    document.getElementById('cursor').textContent =
      `(${state.cursorWorld.x.toFixed(1)}, ${state.cursorWorld.y.toFixed(1)})`;
  }
}

// Re-render when tiles finish loading.
tileMap.onLoad = render;

// ── Mouse handlers ────────────────────────────────────────────
canvas.addEventListener('mousedown', (e) => {
  state.drag = {
    startMouseX: e.clientX, startMouseY: e.clientY,
    startCenterX: state.view.centerX, startCenterY: state.view.centerY,
  };
  canvas.classList.add('dragging');
});

window.addEventListener('mouseup', () => {
  state.drag = null;
  canvas.classList.remove('dragging');
});

canvas.addEventListener('mousemove', (e) => {
  // Track cursor world position (for HUD).
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  state.cursorWorld = tileMap.screenToWorld(mx, my, state.view);

  if (state.drag) {
    const dx = e.clientX - state.drag.startMouseX;
    const dy = e.clientY - state.drag.startMouseY;
    const mpp = tileMap.metersPerPixel(state.view.zoom);
    // Inverse of worldToScreen — Y inverted.
    state.view.centerX = state.drag.startCenterX - dx * mpp;
    state.view.centerY = state.drag.startCenterY + dy * mpp;
    render();
  } else {
    updateHud();
  }
});

canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;

  // World position under cursor BEFORE zoom — we keep it fixed.
  const before = tileMap.screenToWorld(mx, my, state.view);

  const zoomDelta = -e.deltaY * 0.002;  // smooth
  const newZoom = Math.min(TILES_CONST.MAX_Z, Math.max(TILES_CONST.MIN_Z, state.view.zoom + zoomDelta));
  state.view.zoom = newZoom;

  // World position under cursor AFTER zoom — recenter so the before-point stays under cursor.
  const after = tileMap.screenToWorld(mx, my, state.view);
  state.view.centerX += before.x - after.x;
  state.view.centerY += before.y - after.y;

  render();
}, { passive: false });

// ── Buttons ──────────────────────────────────────────────────
document.getElementById('btn-markers').addEventListener('click', (e) => {
  state.showMarkers = !state.showMarkers;
  e.target.classList.toggle('active', state.showMarkers);
  render();
});

document.getElementById('btn-reset').addEventListener('click', () => {
  state.view.centerX = DEFAULT_VIEW.centerX;
  state.view.centerY = DEFAULT_VIEW.centerY;
  state.view.zoom = DEFAULT_VIEW.zoom;
  render();
});

// ── Init ─────────────────────────────────────────────────────
window.addEventListener('resize', resize);
resize();
</script>
</body>
</html>
