name: healthcheck
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  healthcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: deps
        run: pip install numpy scipy pillow tqdm
      - name: healthcheck
        run: PYTHONPATH=. python3 tools/ci_healthcheck.py
